# The slice's events (docs/design/systems/phase1-slice.md §5.7, §5.8, §7). M5a's four first, then M5b's.
# trigger: { date: YYYY-MM } for an anchor (fires in the first month on or after it; the date cites the anchor's
# claim); { prologue_turn: n } for a scripted beat (turn 0 is the scenario's first quarter); { month_of_year: m,
# recurring: true } for a seasonal one (0 = January); { hazard: p, ... } for an emergent one, drawn each month;
# { condition: c } for a milestone. Never a year in code. requires / until: an unlock key that must be set, or not yet.
# effects apply when the event fires; on_answer effects apply the month after its card is answered, an effect with
# option: only for that option. Effect numbers are in params/slice.yaml under events.<id>.
# Card options: the headless default first. A card that only reports offers `noted`. card.lapse: the option a
# non-interrupting card takes when it expires unanswered (a crisis cannot be ignored for free).
# description (R7, §5.7): every card has one, { zh, en }: what happened and why it matters, no params numbers.

- id: event.first_processing_contract
  name: { zh: 第一份来料加工合同, en: Our first processing contract }
  family: scripted
  trigger: { prologue_turn: 1 }          # 1979-Q2 (§2.1)
  # a guaranteed offer in the market town: "our first contract", not the city's (§6.5)
  effects:
    - { kind: offer, archetype: investor.hk_processing }
  claims:
    - { id: phase1.industry.processing_contract, use: design_note }

- id: event.shekou_works
  name: { zh: 蛇口工业区破土动工, en: Shekou breaks ground }
  family: anchor
  trigger: { date: 1979-07 }
  # from here Shekou competes for the investors the player loses (§5.7)
  effects:
    - { kind: unlock, key: shekou.competes }
  claims:
    - { id: phase1.event.shekou_works, use: anchor_date }

- id: event.readiness_check
  name: { zh: 特区筹备情况汇报, en: The readiness check }
  description:
    zh: "一份汇报列出罗湖、上步一带的道路、已平整土地和水电，并指出最薄弱的一环。这是特区成立前最后一个可以安排工程的季度：准备得越充分，第一批投资者越多。"
    en: "A report on roads, formed land, and water and power near Luohu and Shangbu names the weakest part. This is the last quarter to commit works before the zone opens: the readier the land, the larger the first wave of investors."
  family: scripted
  trigger: { prologue_turn: 5 }          # 1980-Q2, the last quarter to commit (§2.1)
  effects:
    - { kind: readiness_check }          # the card carries the report and the first wave's forecast
  card:
    interrupting: true                   # a prologue decision: answered in its month (§5.8)
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
      - { id: rush, name: { zh: 抢工期, en: Rush the works } }
  on_answer:                             # M5b (§5.8): every live project to high priority, at a cost
    - { kind: rush, option: rush }
    - { kind: cost, option: rush }
  claims: []                             # a design milestone (design_note in §2.1)

- id: event.sez_established
  name: { zh: 经济特区成立, en: The Special Economic Zone is established }
  description:
    zh: "经济特区成立，从此可以接受外来投资。你选的优先方向决定第一批投资者的构成。"
    en: "The Special Economic Zone opens, and outside investors can now be accepted. The priority you choose steers the mix of the first wave."
  family: anchor
  trigger: { date: 1980-08 }
  card:
    interrupting: true
    options:                             # the first priorities (§7.1 step 2); the mix is params.sez.priorities
      - { id: priority.industry, name: { zh: 工业与来料加工, en: Industry and processing } }
      - { id: priority.trade, name: { zh: 港口与贸易, en: The port and trade } }
      - { id: priority.commerce, name: { zh: 商业与旅游, en: Commerce and tourism } }
  on_answer:                             # the opening, the month after the answer (§7.1 step 3)
    - { kind: sez_open }
    - { kind: set_regime, regime: regime.contracting_1980s }
    - { kind: unlock, key: investors.sez }
    - { kind: first_wave }
  claims:
    - { id: phase1.event.sez_regulations, use: anchor_date }
    - { id: phase1.fiscal.sez_income_tax_1980, use: design_note }

# ---- M5b (§5.8): the prologue beats ----

- id: event.first_project
  name: { zh: 第一个工程, en: The first project }
  description:
    zh: "你和搭档第一次商量，第一项工程放在哪里。通往罗湖、渔民村一带的道路或水管，是日后投资者和建设者最先需要的。"
    en: "You and your partner in the leadership decide where the first work goes. A road or a water main toward Luohu and Yumin is what later investors and builders will need first."
  family: scripted
  trigger: { prologue_turn: 0 }          # 1979-Q1: meet the pair, choose the first project toward Luohu (§2.1)
  card:
    interrupting: true                   # a prologue decision: answered in its month (§5.8)
    options:
      - { id: project.road_link, name: { zh: 修通往罗湖的路, en: A road toward Luohu } }
      - { id: project.water_main, name: { zh: 铺设供水管道, en: A water main } }
      - { id: later, name: { zh: 以后再说, en: Later } }
  on_answer:
    - { kind: commit_choice, area: 2 }   # Luohu crossing and Yumin; `later` commits nothing
  claims:
    - { id: phase1.map.shennan_1980, use: design_note }

- id: event.shenzhen_city
  name: { zh: 宝安县改设深圳市, en: "Bao'an County becomes Shenzhen City" }
  description:
    zh: "宝安县改设深圳市，这座城市的账从此由你来管。账面上暂时没有变化，这张卡只是一个起点。"
    en: "Bao'an County becomes Shenzhen City, and the city's accounts are now yours to keep. Nothing in the ledger changes yet; this card only marks the start."
  family: anchor
  trigger: { date: 1979-03 }             # a declared fact (§2.1)
  card:
    interrupting: false
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
  claims:
    - { id: phase1.event.shenzhen_city_approval, use: anchor_date }

- id: event.shekou_command
  name: { zh: 蛇口工业区建设指挥部成立, en: "Shekou's construction headquarters is set up" }
  description:
    zh: "蛇口的建设指挥部成立。蛇口不在你的地图上，但在游戏里它会成为争夺投资者的对手。"
    en: "Shekou's construction headquarters is set up next door. Shekou is not on your map, but in this game it becomes a rival for the investors you lose."
  family: anchor
  trigger: { date: 1979-04 }             # a declared fact (§2.1)
  card:
    interrupting: false
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
  claims:
    - { id: phase1.event.shekou_command, use: anchor_date }

- id: event.permit_choice
  name: { zh: 临时建房许可, en: Temporary building permits }
  description:
    zh: "建设者和新来的人都要申请临时建房许可。审批的宽严会影响外来人口来多少，也影响上级对你的关注。"
    en: "Builders and newcomers want permits for temporary buildings. How freely you grant them changes how many migrants come and how closely the province watches you."
  family: scripted
  trigger: { prologue_turn: 2 }          # 1979-Q3: the permit regime and the scrutiny gauge switch on (§2.1)
  effects:
    - { kind: unlock, key: scrutiny.gauge }
  card:
    interrupting: true                   # a prologue decision: answered in its month (§5.8)
    options:
      - { id: standard, name: { zh: 照章审批, en: Standard approvals } }
      - { id: loose, name: { zh: 先建后批, en: "Build first, approve later" } }
      - { id: strict, name: { zh: 从严审批, en: Strict approvals } }
  on_answer:
    - { kind: set_permit }
  claims: []                             # a design beat

- id: event.typhoon
  name: { zh: 台风, en: A typhoon }
  description:
    zh: "台风吹坏了工棚、道路和在建工程。马上抢修要花钱；放着不修，会引起上级关注。"
    en: "A typhoon has damaged sheds, roads and works in progress. Repairing now costs money; leaving it draws the province's attention."
  family: emergent
  trigger: { hazard: 0.15, months_of_year: [6, 7, 8], from_turn: 2, guaranteed_by_turn: 2, recurring: true }
  card:
    interrupting: false
    lapse: defer                         # ignored, it is that choice
    options:
      - { id: repair, name: { zh: 立即抢修, en: Repair now } }
      - { id: defer, name: { zh: 暂缓修复, en: Leave it for now } }
  on_answer:
    - { kind: cost, option: repair }
    - { kind: scrutiny, option: defer }
  claims:
    - { id: phase1.event.typhoon_1979, use: design_note }   # a lead: the storm stays emergent, not an anchor

- id: event.corps_advance
  name: { zh: 基建工程兵先遣队到达, en: "The engineering corps' advance units arrive" }
  description:
    zh: "基建工程兵先遣队到了，加入施工。他们要有地方住：盖营房马上花钱，住竹棚帐篷会引起关注。"
    en: "The engineering corps' advance units arrive to join the works. They need somewhere to live: quarters cost money now, while tents and bamboo sheds draw attention."
  family: scripted
  trigger: { prologue_turn: 3 }          # 1979-Q4 (§2.1)
  effects:
    - { kind: contract_team, team: team.corps_advance }
  card:
    interrupting: true                   # a prologue decision: answered in its month (§5.8)
    options:
      - { id: quarters, name: { zh: 盖临时营房, en: Build them quarters } }
      - { id: tents, name: { zh: 先住竹棚帐篷, en: Bamboo sheds and tents } }
  on_answer:
    - { kind: cost, option: quarters }
    - { kind: scrutiny, option: tents }
  claims:
    - { id: phase1.event.construction_corps_first_units, use: design_note }
    - { id: phase1.event.construction_corps_december_arrival, use: design_note }

- id: event.cofinancing
  name: { zh: 1980年工作汇报：贷款与合作建设, en: "The 1980 briefing: a loan and a co-financing offer" }
  description:
    zh: "年度工作汇报带来了银行的项目贷款，还有一位香港投资者提出出资在墟镇建一条电力线路。接受合作建设，城市不花钱就有了线路，代价是给这位投资者优惠条件。"
    en: "The year's briefing brings the bank's project loan and an offer from a Hong Kong investor to build a power line in the market town. Accepting the co-financing gets the line at no cost to the city, in return for a concession to the investor."
  family: scripted
  trigger: { prologue_turn: 4 }          # 1980-Q1 (§2.1)
  effects:
    - { kind: offer_loan }               # the state bank's project loan (§5.6), unless taken or pending
  card:
    interrupting: true                   # a prologue decision: answered in its month (§5.8)
    options:
      - { id: decline, name: { zh: 婉拒, en: Decline } }
      - { id: accept, name: { zh: 接受合作建设, en: Accept the co-financing } }
  on_answer:                             # a Hong Kong investor builds a power line in the market town, for a concession
    - { kind: cofinance, template: project.power_line, area: 1, option: accept }
    - { kind: offer, archetype: investor.hk_processing, terms: true, option: accept }
  claims: []                             # a design beat

# ---- M5b: the recurring cards ----

- id: event.budget
  name: { zh: 年度预算, en: "The year's budget" }
  description:
    zh: "省里确定今年的补助，简报列出补助之后的经常性收支。安排今年的工程，要想到补助减少以后城市还撑不撑得住。"
    en: "The province sets this year's grant, and the briefing shows the recurring balance it leaves. Plan the year's works against what the city can carry once the grant shrinks."
  family: recurring
  trigger: { month_of_year: 0, recurring: true }
  effects:
    - { kind: budget_report }            # the grant factor, the recurring balance, the four-quarter warning
  card:
    interrupting: false
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
  claims:
    - { id: phase1.fiscal.contracting_retain, use: design_note }

- id: event.sweep
  name: { zh: 迎检整顿, en: A pre-inspection sweep }
  description:
    zh: "年度考核快到了，违建楼面会被扣分。突击整顿能暂时把它们遮住，但要花钱、伤外来人口的情绪，而且突击检查仍可能发现。"
    en: "The annual review is coming, and illegal floors count against you. A sweep hides them for a while, but it costs money and migrants' goodwill, and an unannounced inspection can still find them."
  family: recurring
  trigger: { month_of_year: 9, recurring: true }   # October, before December's review
  card:
    interrupting: true
    options:
      - { id: no_sweep, name: { zh: 照常, en: Carry on as usual } }
      - { id: sweep, name: { zh: 突击整顿, en: Sweep before the inspectors come } }
  on_answer:
    - { kind: sweep, option: sweep }
  claims: []                             # a design mechanic (leadership §4.4)

# ---- M5b: the other anchors (§7) ----

- id: event.bamboo_garden
  name: { zh: 竹园宾馆开业, en: The Bamboo Garden Hotel opens }
  description:
    zh: "竹园宾馆开业。这里把它记作时代的标记，对游戏没有影响。"
    en: "The Bamboo Garden Hotel opens. It is noted here as a marker of the times; it changes nothing in the game."
  family: anchor
  trigger: { date: 1981-01 }
  card:
    interrupting: false
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
  claims:
    - { id: phase1.event.bamboo_garden_opens, use: anchor_date }

- id: event.land_rules
  name: { zh: 特区土地管理暂行规定施行, en: The land-use rules take effect }
  description:
    zh: "特区土地管理暂行规定施行。此后城市收取的土地使用费按这套规定执行。"
    en: "The zone's land-use rules take effect. From now on the land-use fees the city collects follow these rules."
  family: anchor
  trigger: { date: 1982-01 }             # the fees are the regime's dated schedule (§5.6)
  card:
    interrupting: false
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
  claims:
    - { id: phase1.event.land_rules_1981, use: anchor_date }

- id: event.second_line
  name: { zh: 特区管理线动工, en: Work begins on the second-line fence }
  description:
    zh: "特区管理线开始动工。这里只作记录，试玩不模拟这条管理线。"
    en: "Work begins on the second-line fence. It is noted here as a marker; the slice does not model the fence."
  family: anchor
  trigger: { date: 1982-06 }
  card:
    interrupting: false
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
  claims:
    - { id: phase1.event.second_line_construction, use: anchor_date }

- id: event.corps_deployment
  name: { zh: 基建工程兵大部队调深, en: The main engineering corps deployment }
  description:
    zh: "一支基建工程兵大部队可以调来支援城市建设。接收后施工力量大增，但每月要付一笔费用。"
    en: "A large engineering corps deployment is offered to the city's works. Taking them on adds a big team to the construction pool, at a monthly cost."
  family: scripted                       # not an anchor: the claim gives the year and says autumn, so the month
  trigger: { date: 1982-09 }             # is a design choice within that season; it needs a source to be an anchor
  card:
    interrupting: true
    options:
      - { id: accept, name: { zh: 接收, en: Take them on } }
      - { id: decline, name: { zh: 婉拒, en: Decline } }
  on_answer:
    - { kind: contract_team, team: team.engineering_corps, option: accept }
  claims:
    - { id: phase1.event.construction_corps_arrival, use: design_note }

- id: event.temporary_residence
  name: { zh: 特区暂住证暂行规定, en: The temporary-residence rules }
  description:
    zh: "新规定明确了在特区暂住要办的手续。执行的宽严会影响外来人口来多少。"
    en: "New rules set how temporary residence in the zone is documented. How strictly you apply them changes how many migrants come."
  family: anchor
  trigger: { date: 1983-07 }
  card:
    interrupting: false
    options:
      - { id: standard, name: { zh: 照章办理, en: Standard approvals } }
      - { id: strict, name: { zh: 从严办理, en: Strict approvals } }
  on_answer:
    - { kind: set_permit }
  claims:
    - { id: phase1.event.temporary_residence_documents, use: anchor_date }

# ---- R9 (§5.8): the news layer. No card, no pause; shown in the next briefing (§11.2). Design and calendar:
# docs/design/systems/prologue-flavor-and-news.md §3-§4. Every fact cites a sourced claim (use: encyclopedia);
# a quotation is a claim's own quote, shortened. The two opening letters are fiction that carries cited facts. ----

- id: news.1979q1.assignment
  name: { zh: 省委组织部介绍信, en: A letter from the Provincial Organization Department }
  family: news
  trigger: { prologue_turn: 0 }          # the opening letters fire at init with the turn-0 beats (§5.8)
  news: { desk: province, tone: opening }
  text:
    zh: "兹介绍×××同志前往深圳市革命委员会工作。该同志政治可靠，熟悉财经与城建，请予接洽。深圳市系新设省辖市，任务繁重。望到职后，依靠市委领导，团结原有干部，先把情况摸清，再定章程。此致革命敬礼。中共广东省委组织部，一九七九年三月。"
    en: "Comrade ××× is assigned to the Shenzhen Municipal Revolutionary Committee. Politically reliable, with experience in finance and construction. Please receive this comrade. Shenzhen is a newly established provincial municipality with heavy duties. On arrival, work under the Municipal Party Committee, respect the cadres already here, and understand conditions before setting rules. With revolutionary greetings, Organization Department, CPC Guangdong Provincial Committee, March 1979."
  claims:
    - { id: phase1.politics.province_decision_1979, use: encyclopedia }
    - { id: phase1.politics.city_reply_1979, use: encyclopedia }

- id: news.1979q1.office_note
  name: { zh: 市革委会办公室便笺, en: A note from the Revolutionary Committee office }
  family: news
  trigger: { prologue_turn: 0 }
  news: { desk: city, tone: opening }
  text:
    zh: "同志：县里的印封了，市里的印还没刻好。你先用这张便条。省里让我们先按“出口基地”做方案。“特区”这个名字，等北京定了再说，先不要对外讲。眼下三件事：一、把地图挂起来。罗湖、上步、深圳墟，哪块地是谁的，哪条路通哪里，先弄清楚。二、选一块能开工的地。不要贪大，先把水、电、路通到地边。三、账上只有省里的补助，没有余钱。花每一笔，都要想着明年省里少给怎么办。饭堂在楼下，饭票自理。此致革命敬礼。市革委会办公室，一九七九年三月。"
    en: "Comrade: the county seal is sealed up; the city's seal is not yet cut. Use this note for now. The province wants us to plan on the basis of an “export base”. The name “special zone” will wait for Beijing; do not use it in public yet. Three things for now. 1. Hang the map: find out who holds each plot in Luohu, Shangbu and the old market, and which road goes where. 2. Choose one piece of land you can actually start on. Do not be ambitious: get water, power and road to its edge first. 3. The account holds the provincial grant and little else. For every yuan you spend, ask what happens when the grant is smaller next year. The canteen is downstairs; meal tickets are your own. With revolutionary greetings, Office of the Municipal Revolutionary Committee, March 1979."
  claims:
    - { id: phase1.politics.city_reply_1979, use: encyclopedia }

- id: news.1979q1.city_reply
  name: { zh: 国务院批复：宝安县改设深圳市, en: "The State Council's reply: Bao'an becomes Shenzhen City" }
  family: news
  trigger: { date: 1979-03 }
  news: { desk: province, tone: opening }
  text:
    zh: "国务院批复：将宝安县改设为深圳市，市革命委员会驻深圳。省委一月间已作出撤县设市的决定。"
    en: "The State Council has replied: Bao'an County becomes Shenzhen City, and the municipal revolutionary committee sits at Shenzhen. The provincial committee had decided on the change in January."
  claims:
    - { id: phase1.politics.city_reply_1979, use: encyclopedia }
    - { id: phase1.politics.province_decision_1979, use: encyclopedia }

- id: news.1979q2.zone_name
  name: { zh: 中央工作会议：“还是叫特区好”, en: "The work conference: call it a special zone" }
  family: news
  trigger: { date: 1979-04 }
  news: { desk: beijing, tone: relief }
  text:
    zh: "四月中央工作会议上，广东请求先走一步。邓小平说：“还是叫特区好……中央没有钱，可以给些政策，你们自己去搞，杀出一条血路来。”"
    en: "At the April central work conference Guangdong asked to go first. Deng Xiaoping said it should be called a special zone: the centre had no money, but could give policy, and Guangdong should go and do it itself."
  claims:
    - { id: phase1.politics.central_work_conference_1979, use: encyclopedia }

- id: news.1979q3.document_50
  name: { zh: 中央50号文件：特殊政策、灵活措施, en: "Document 50: special policies, flexible measures" }
  family: news
  trigger: { date: 1979-07 }
  news: { desk: province, tone: relief }
  text:
    zh: "中央50号文件下达：对广东、福建两省对外经济活动实行特殊政策和灵活措施。"
    en: "Central Document 50 is issued: Guangdong and Fujian may use special policies and flexible measures in their foreign economic activity."
  claims:
    - { id: phase1.politics.special_policies_1979, use: encyclopedia }

- id: news.1979q3.organs
  name: { zh: 市级机构六十一个, en: Sixty-one municipal organs }
  family: news
  trigger: { date: 1979-08 }
  news: { desk: city, tone: texture }
  text:
    zh: "市级机构定为61个，比原来的宝安县机关多12个。"
    en: "The city now has 61 municipal organs, twelve more than the old Bao'an county offices."
  claims:
    - { id: phase1.local.city_organs_1979, use: encyclopedia }

- id: news.1979q4.provincial_city
  name: { zh: 深圳升格为地区一级省辖市, en: Shenzhen becomes a prefecture-level provincial city }
  family: news
  trigger: { date: 1979-11 }
  news: { desk: province, tone: relief }
  text:
    zh: "深圳市升格为地区一级的省辖市，由广东省委直接领导，政权机关仍称深圳市革命委员会。从明年一月一日起，市里的计划直接列入省的计划。"
    en: "Shenzhen becomes a prefecture-level municipality under the provincial committee's direct leadership; its organ of government is still the Municipal Revolutionary Committee. From 1 January the city's plans go straight onto the province's list."
  effects:                               # the province now plans for, and supplies, the city directly (revision plan §4.4)
    - { kind: unlock, key: power.purchase }
  claims:
    - { id: phase1.politics.provincial_city_1979, use: encyclopedia }

- id: news.1980q1.east_lake
  name: { zh: 东湖丽苑：以地换资, en: "East Lake Garden: land for capital" }
  family: news
  trigger: { date: 1980-02 }             # the sale's month; the signing's day is in conflict (31 Dec / 1 Jan)
  news: { desk: city, tone: texture }
  text:
    zh: "市里出让土地使用权，港商出钱盖楼并负责销售，利润按85%、15%分成。因为出租土地还不合法，合同按补偿贸易签。第一期108套在香港三天卖完。"
    en: "The city supplies the land use, a Hong Kong developer the money and the sales, and the profit is split 85:15. Leasing land is not yet lawful, so the contract is signed as compensation trade. The first 108 flats sold out in Hong Kong in three days."
  claims:
    - { id: phase1.local.donghu_liyuan_contract_1979, use: encyclopedia }
    - { id: phase1.local.donghu_liyuan_sales_1980, use: encyclopedia }

- id: news.1980q2.build_shenzhen_first
  name: { zh: 先把深圳特区建设好, en: Build the Shenzhen zone first }
  family: news
  trigger: { date: 1980-05 }
  news: { desk: beijing, tone: relief }
  text:
    zh: "中央批转两省会议纪要：广东应首先集中力量把深圳特区建设好，其次是珠海；“出口特区”改称“经济特区”，特区主要是实行市场调节。"
    en: "The centre approves the two-province minutes: Guangdong is to concentrate first on building the Shenzhen zone, then Zhuhai. “Export zone” becomes “special economic zone”, and the zone is to rely mainly on market regulation."
  claims:
    - { id: phase1.politics.shenzhen_first_1980, use: encyclopedia }
    - { id: phase1.politics.sez_market_1980, use: encyclopedia }

- id: news.1980q4.newspaper_decision
  name: { zh: 市委决定办一份报纸, en: The city decides to found a newspaper }
  family: news
  trigger: { date: 1980-11 }
  news: { desk: city, tone: texture }
  text:
    zh: "市委常委会决定，由市委宣传部负责筹办一份报纸。"
    en: "The Municipal Party Committee's standing committee decides that the city will found a newspaper, with the propaganda department in charge."
  claims:
    - { id: phase1.local.sztqb_decision_1980, use: encyclopedia }

- id: news.1981q1.shekou_slogan
  name: { zh: 时间就是金钱，效率就是生命, en: "Time is money, efficiency is life" }
  family: news
  trigger: { date: 1981-03 }
  news: { desk: city, tone: texture }
  text:
    zh: "蛇口工业区的袁庚提出口号：“时间就是金钱，效率就是生命”。口号引起争议，写着它的木牌后来几度拆下又竖起。"
    en: "Yuan Geng of the Shekou industrial zone puts out a slogan: “Time is money, efficiency is life”. It is controversial, and the board that carries it will be taken down and put up again more than once."
  claims:
    - { id: phase1.local.shekou_slogan_1981, use: encyclopedia }
    - { id: phase1.local.shekou_slogan_sign_1981, use: encyclopedia }

- id: news.1981q2.newspaper_trial
  name: { zh: 《深圳特区报》试刊, en: The Special Zone Daily's trial issue }
  family: news
  trigger: { date: 1981-06 }
  news: { desk: city, tone: texture }
  text:
    zh: "《深圳特区报》出了第一期试刊。市里没有印刷厂，报纸在香港印；报头是红色的，头版登广告。"
    en: "The Shenzhen Special Zone Daily prints its first trial issue. The city has no press, so it is printed in Hong Kong; the masthead is red and the front page carries advertising."
  claims:
    - { id: phase1.local.sztqb_trial_1981, use: encyclopedia }

- id: news.1981q3.document_27
  name: { zh: 中央27号文件：经济特区，不是政治特区, en: "Document 27: economic zones, not political ones" }
  family: news
  trigger: { date: 1981-07 }
  news: { desk: beijing, tone: relief }
  text:
    zh: "中央27号文件批转特区工作会议纪要：“我国特区是经济特区，不是政治特区。”深圳特区应成立特区人民政府，归省直接领导，并恢复宝安县建制。"
    en: "Central Document 27 approves the zones' work-meeting minutes: “Our special zones are economic special zones, not political special zones.” Shenzhen is to set up a zone people's government under the province's direct leadership, and Bao'an County is to be restored."
  claims:
    - { id: phase1.politics.sez_not_concession_1981, use: encyclopedia }
    - { id: phase1.politics.sez_government_1981, use: encyclopedia }

- id: news.1981q4.government
  name: { zh: 深圳市人民政府, en: "The Shenzhen Municipal People's Government" }
  family: news
  trigger: { date: 1981-12 }
  news: { desk: city, tone: relief }
  text:
    zh: "十月，深圳市经济特区人民政府正式成立，深圳市革命委员会取消。十二月，经国务院批准，定名为深圳市人民政府。"
    en: "In October the Shenzhen Special Economic Zone People's Government was established and the Revolutionary Committee abolished. In December, with the State Council's approval, it takes the name Shenzhen Municipal People's Government."
  claims:
    - { id: phase1.local.sez_government_1981_10, use: encyclopedia }
    - { id: phase1.local.sz_gov_rename_1981_12, use: encyclopedia }

- id: news.1981q4.chenyun
  name: { zh: 陈云：特区第一位的任务是总结经验, en: "Chen Yun: the zones' first task is to sum up experience" }
  family: news
  trigger: { date: 1981-12 }
  news: { desk: beijing, tone: warning }
  text:
    zh: "在省市区第一书记座谈会上，陈云说：“特区第一位的任务是认真总结经验”，特区暂时不再增加。"
    en: "At the forum of provincial first secretaries, Chen Yun said the zones' first task is to sum up experience conscientiously, and that no new zones should be added."
  claims:
    - { id: phase1.politics.chenyun_summary_1981, use: encyclopedia }

- id: news.1982q1.concession_material
  name: { zh: 旧中国租界的由来, en: The origin of the old concessions }
  family: news
  trigger: { date: 1982-02 }             # the forum's month; the newspaper route and January date stay in the conflict
  news: { desk: beijing, tone: warning }
  text:
    zh: "中央书记处召开广东、福建两省座谈会，会上推荐印发了一份关于旧中国租界由来的材料。陈云批示：“此件发全国各省市。对于办经济特区，要警惕这类问题。”一月，中央已发出打击走私的紧急通知。"
    en: "The Central Secretariat has held the Guangdong–Fujian forum and circulated a compilation on the origin of the old foreign concessions. Chen Yun's instruction: send it to every province; in special-zone work, be on guard against this kind of problem. In January the centre had already issued an emergency notice against smuggling."
  claims:
    - { id: phase1.politics.two_provinces_meeting_1982, use: encyclopedia }
    - { id: phase1.politics.concession_material_1982, use: encyclopedia }
    - { id: phase1.politics.chenyun_concession_warning_1982, use: encyclopedia }
    - { id: phase1.politics.smuggling_notice_1982, use: encyclopedia }

- id: news.1982q2.economic_crime
  name: { zh: 打击经济领域严重犯罪活动的决定, en: The decision against serious economic crime }
  family: news
  trigger: { date: 1982-04 }
  news: { desk: beijing, tone: warning }
  text:
    zh: "中央作出打击经济领域严重犯罪活动的决定：实行对外开放和对内搞活经济的政策，必须坚持以计划经济为主、市场调节为辅；这一政策决不会因打击犯罪而改变和动摇。"
    en: "The centre decides on a campaign against serious economic crime. Opening up and enlivening the economy must keep to planning first and market regulation second; the policy itself, it says, will not change or waver because of the campaign."
  claims:
    - { id: phase1.politics.economic_crime_1982, use: encyclopedia }
    - { id: phase1.politics.open_door_unchanged_1982, use: encyclopedia }

- id: news.1982q2.newspaper_launch
  name: { zh: 《深圳特区报》正式创刊, en: The Special Zone Daily is launched }
  family: news
  trigger: { date: 1982-05 }
  news: { desk: city, tone: texture }
  text:
    zh: "试刊五期之后，《深圳特区报》正式创刊。"
    en: "After five trial issues, the Shenzhen Special Zone Daily is formally launched."
  claims:
    - { id: phase1.local.sztqb_founded_1982, use: encyclopedia }

- id: news.1982q3.census
  name: { zh: 第三次全国人口普查, en: The third national census }
  family: news
  trigger: { date: 1982-07 }
  news: { desk: city, tone: texture }
  text:
    zh: "第三次全国人口普查以七月一日零时为标准时间登记。市里第一次有了一份全市的人口普查数。"
    en: "The third national census takes midnight on 1 July as its moment. For the first time the city has a census count of its own people."
  claims:
    - { id: phase1.local.census_1982, use: encyclopedia }
    - { id: phase1.local.census_total_1982, use: design_note }   # context only: the count is never shown or targeted

- id: news.1982q3.congress
  name: { zh: 十二大：建设有中国特色的社会主义, en: "The Twelfth Congress: socialism with Chinese characteristics" }
  family: news
  trigger: { date: 1982-09 }
  news: { desk: beijing, tone: texture }
  text:
    zh: "党的十二大开幕。邓小平说：“走自己的道路，建设有中国特色的社会主义。”大会报告提出，力争使全国工农业的年总产值翻两番。"
    en: "The Twelfth Party Congress opens. Deng Xiaoping says China will take its own road and build socialism with Chinese characteristics. The congress report sets a target of quadrupling gross industrial and agricultural output."
  claims:
    - { id: phase1.politics.12th_congress_1982, use: encyclopedia }
    - { id: phase1.politics.output_target_1982, use: encyclopedia }

- id: news.1982q4.storm_passes
  name: { zh: 特区要办, en: The zone is to be run }
  family: news
  trigger: { date: 1982-12 }
  news: { desk: beijing, tone: relief }
  text:
    zh: "十月，陈云批准了广东试办特区的总结：“特区要办，必须不断总结经验，力求使特区办好。”十二月，中央新的特区工作纪要提出：特区要有更多的自主权，深圳、珠海要逐步办成综合性特区。"
    en: "In October Chen Yun approved Guangdong's summary of the trial zones: the zone must be run, with experience constantly summed up. In December new central minutes give the zones more autonomy, and make Shenzhen and Zhuhai comprehensive zones of industry, commerce, agriculture, housing and tourism."
  effects:                               # more autonomy once the summary is approved (revision plan §4.4)
    - { kind: unlock, key: intensity.high }
  claims:
    - { id: phase1.politics.chenyun_summary_1982, use: encyclopedia }
    - { id: phase1.politics.new_50_1982, use: encyclopedia }
    - { id: phase1.politics.sez_comprehensive_1982, use: encyclopedia }

- id: news.1983q1.hu_visit
  name: { zh: 胡耀邦视察深圳, en: Hu Yaobang visits Shenzhen }
  family: news
  trigger: { date: 1983-02 }
  news: { desk: beijing, tone: relief }
  text:
    zh: "胡耀邦视察深圳，要求创新：“新事新办、特事特办、立场不变、方法全新。”此行没有公开报道。"
    en: "Hu Yaobang has visited Shenzhen and told the city to innovate: new things handled in new ways, special things handled specially, the stand unchanged, the methods wholly new. The trip is not publicly reported."
  claims:
    - { id: phase1.politics.hu_yaobang_1983, use: encyclopedia }

- id: news.1983q2.deng_relay
  name: { zh: 谷牧转达：特区办得不错, en: "Gu Mu relays: the zones are doing well" }
  family: news
  trigger: { date: 1983-06 }
  news: { desk: beijing, tone: relief }
  text:
    zh: "谷牧转达邓小平的意见：特区“现在办得不错，中外承认，不存在抹掉不干的问题”。"
    en: "Gu Mu relays Deng Xiaoping's view: the zones are doing well, are recognised at home and abroad, and there is no question of abolishing them."
  claims:
    - { id: phase1.politics.deng_via_gumu_1983, use: encyclopedia }

- id: news.1983q3.strike_hard
  name: { zh: 严厉打击刑事犯罪活动, en: The campaign against serious crime }
  family: news
  trigger: { date: 1983-08 }
  news: { desk: beijing, tone: warning }
  text:
    zh: "中央作出严厉打击刑事犯罪活动的决定，开始为期三年的“严打”，依法“从重从快”。"
    en: "The centre decides on a three-year campaign against serious crime, to be prosecuted heavily and quickly under the law."
  claims:
    - { id: phase1.politics.strike_hard_1983, use: encyclopedia }

- id: news.1983q3.university
  name: { zh: 深圳大学开学, en: Shenzhen University opens }
  family: news
  trigger: { date: 1983-09 }
  news: { desk: city, tone: texture }
  text:
    zh: "深圳大学在深圳戏院举行成立暨首届开学典礼：216名学生，四个系，校园还在建设中。"
    en: "Shenzhen University holds its founding and first opening ceremony in the Shenzhen Theatre: 216 students in four departments, on a campus still being built."
  claims:
    - { id: phase1.local.szu_opens_1983, use: encyclopedia }

# ---- M5b: milestones ----

- id: event.first_zone
  name: { zh: 第一个工业区投产, en: The first industrial zone opens }
  description:
    zh: "你规划的区块里第一家企业开工投产。领导班子的上级评价随之提高。"
    en: "The first firm in one of your zones has opened. Your leaders' standing rises with it."
  family: milestone
  trigger: { condition: first_zone_firm_open }
  effects:
    - { kind: standing }
  card:
    interrupting: false
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
  claims: []

- id: event.mandate_met
  name: { zh: 特区任务完成, en: "The zone's mandate is met" }
  family: milestone
  trigger: { condition: first_zone_firm_open }
  requires: investors.sez                # after the SEZ opens
  effects:
    - { kind: unlock, key: mandate.met }
    - { kind: standing }
  claims: []

- id: event.shekou_poach
  name: { zh: 投资者转投蛇口, en: An investor goes to Shekou }
  description:
    zh: "一位你没能安置的投资者转去了蛇口。蛇口每拿走一家，你的城市就少一家企业和它的岗位。"
    en: "An investor you could not place has gone to Shekou instead. Each one Shekou takes is a firm, and its jobs, that your city will not have."
  family: milestone
  trigger: { condition: shekou_captured }   # M5a's capture, shown the first time it happens
  card:
    interrupting: false
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
  claims: []

# ---- M5b: emergent events, each drawn from the events stream ----

- id: event.orders_surge
  name: { zh: 香港订单激增, en: Hong Kong orders surge }
  family: emergent
  trigger: { hazard: 0.02, from_turn: 4, recurring: true }
  effects:
    - { kind: offer, archetype: investor.hk_processing }   # a firm wants capacity now: an extra offer
  claims: []

- id: event.orders_slump
  name: { zh: 香港订单下滑, en: Hong Kong orders slump }
  description:
    zh: "香港的订单一时下滑。订单恢复之前，加工企业的生产和招工都会减少。"
    en: "Hong Kong's orders fall for a while. Until they recover, processing firms produce less and hire fewer workers."
  family: emergent
  trigger: { hazard: 0.02, from_turn: 4, recurring: true }
  effects:
    - { kind: orders }
  card:
    interrupting: false
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
  claims: []

- id: event.fire
  name: { zh: 厂房宿舍火灾, en: A fire in a factory with dormitories }
  description:
    zh: "一间楼上住人的厂房起火，今年考核的秩序一项会因此不及格。抚恤整改要花钱；低调处理会引起上级关注。"
    en: "A fire breaks out in a factory with dormitories, and this year's review will fail its order check because of it. Compensating and refitting cost money; keeping it quiet draws the province's attention."
  family: emergent
  trigger: { hazard: 0.01, condition: firm_open }
  effects:
    - { kind: veto, reason: order_check }   # that year's review fails its order check
  card:
    interrupting: false
    lapse: noted                         # ignored, it is that choice
    options:
      - { id: compensate, name: { zh: 抚恤整改, en: Compensate and refit } }
      - { id: noted, name: { zh: 低调处理, en: Keep it quiet } }
  on_answer:
    - { kind: cost, option: compensate }
    - { kind: scrutiny, option: noted }
  claims: []

- id: event.escapes
  name: { zh: 偷渡外逃, en: Escapes to Hong Kong }
  description:
    zh: "有人偷渡去香港，消息在传开。加强巡逻要花钱；不予声张会引起上级关注。"
    en: "People are crossing to Hong Kong without permission, and word of it travels. More patrols cost money; saying nothing draws the province's attention."
  family: emergent
  trigger: { hazard: 0.2, from_turn: 1 }
  until: investors.sez                   # before the SEZ; the outflow itself is not modelled (§5.8)
  card:
    interrupting: false
    lapse: noted                         # ignored, it is that choice
    options:
      - { id: patrols, name: { zh: 加强边防巡逻, en: More border patrols } }
      - { id: noted, name: { zh: 不予声张, en: Say nothing } }
  on_answer:
    - { kind: cost, option: patrols }
    - { kind: scrutiny, option: noted }
  claims:
    - { id: phase1.event.escapes_1979, use: design_note }   # a lead: no figure or month is claimed

- id: event.petition
  name: { zh: 村民上访, en: A village petition over compensation }
  description:
    zh: "土地正在平整的村民为补偿上访。补足补偿要花钱；按原方案办，事情会往上反映。"
    en: "Villagers whose land is being formed petition over their compensation. Topping it up costs money; keeping to the plan lets the complaint go up the line."
  family: emergent
  trigger: { hazard: 0.05, condition: village_works, recurring: true }   # R9 (§5.8): only for the player's works
  card:
    interrupting: false
    lapse: noted                         # ignored, it is that choice
    options:
      - { id: compensate, name: { zh: 补足补偿, en: Top up the compensation } }
      - { id: noted, name: { zh: 按原方案, en: Keep to the plan } }
  on_answer:
    - { kind: cost, option: compensate }
    - { kind: scrutiny, option: noted }
  claims: []

# ---- M5b: the closing visit ----

- id: event.deng_visit
  name: { zh: 邓小平首次视察深圳经济特区, en: "Deng Xiaoping's first visit to the Shenzhen SEZ" }
  description:
    zh: "邓小平首次视察深圳经济特区。试玩到此结束，卡片把游戏的结局与这次视察的史实并列。"
    en: "Deng Xiaoping makes his first visit to the Shenzhen SEZ. The slice ends here, and the card sets the game's verdict beside the documented fact of the visit."
  family: anchor
  trigger: { date: 1984-01 }             # in the events step, before that month's finance: the end-1983 state
  effects:
    - { kind: end_run }                  # the card shows the documented fact of the visit beside the game's verdict
  card:
    interrupting: true
    options:
      - { id: noted, name: { zh: 知道了, en: Noted } }
  claims:
    - { id: phase1.event.deng_first_visit, use: anchor_date }
