# Construction teams that can join the slice (docs/design/systems/phase1-slice.md §5.6). Design categories: names
# are lead, and each crew size, mobilisation and cost is a placeholder in params/slice.yaml under the same id.
# modes: pool (adds time-limited capacity to the shared pool) or dedicated (delivers one project outside the pool).
# A contract takes one mode: a crew is never both a pool bonus and a project exemption.
# event_only: true: contracted only by its event (§5.8), never by the player's contract_team.

- id: team.county_crew
  name: { zh: 外县施工队, en: Contracted county crew }
  modes: [dedicated]
  # The historical example is the Lufeng crews on the first Shennan Road section (research note, awaiting intake)
  claims: []

- id: team.engineering_corps
  name: { zh: 基建工程兵, en: Capital Construction Engineering Corps }
  modes: [pool]
  event_only: true                       # R9 (§5.6): a permanent arrival with event.corps_deployment, never a contract
  # Their arrival is M5's: the 1979 advance units and the 1982 deployment, as cards
  claims:
    - { id: phase1.event.construction_corps_first_units, use: design_note }
    - { id: phase1.event.construction_corps_arrival, use: design_note }

- id: team.outside_soe
  name: { zh: 外地国营建筑公司, en: Outside state construction company }
  modes: [dedicated, pool]
  claims: []

- id: team.corps_advance
  name: { zh: 基建工程兵先遣队, en: Engineering corps advance units }
  modes: [pool]
  event_only: true                       # paid centrally: it arrives with event.corps_advance, never by contract
  # M5b's prologue beat (§5.8): the advance and survey units before the main deployment; crews are a placeholder
  claims:
    - { id: phase1.event.construction_corps_first_units, use: design_note }
    - { id: phase1.event.construction_corps_survey, use: design_note }

- id: team.sez_builders
  name: { zh: 特区建筑公司, en: "The zone's construction companies" }
  modes: [pool]
  event_only: true                       # R9 (§5.6): a permanent arrival with the SEZ's establishment
  # a composite (design_note): the zone's own construction companies, not a documented headcount or firm
  claims: []

- id: team.investment_corps
  name: { zh: 基建工程兵与省建队伍, en: The 1982 investment corps }
  modes: [pool]
  event_only: true                       # R9.2: a permanent arrival with the 1982 investment programme
  # a composite (design_note): the crews the 1982 programme brought, not a documented headcount
  claims:
    - { id: phase1.event.construction_corps_arrival, use: design_note }
