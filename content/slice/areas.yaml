# The slice areas (docs/design/systems/phase1-slice.md §3, §5.1). A design proposal, decided 2026-11-23 (§13).
# Names and roles come from general knowledge and are lead; the roles stay in the spec.
# Geometry: each area is a union of whole present-day OSM subdistricts (names without 街道), used as proxies.
# No subdistrict is split, and none belongs to two areas. Redraw from period maps when those are in hand.
# Compile: pipeline/m1_areas.py -> data/starts/slice_areas.json (checks the invariant against the Spike A grid).
