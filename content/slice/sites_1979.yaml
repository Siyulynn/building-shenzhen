# The 1979 site register (docs/design/systems/phase1-slice.md §3.1, milestone M1b).
# Existence and placement have separate claims. See docs/research/phase1-map-sources.md.
# geometry.kind: point (a present-day OSM proxy, low confidence) | unplaced (known to exist, not yet located).
# evidence_status is not stored here: pipeline/m1b_sites.py computes it from the cited claims for the map.
# area: the slice area (phase1-slice.md §3, v0.3): 1–7 playable, 8 Shekou and 9 Nantou card-only.
# in_start_state: card_only for sites in areas 8–9; they appear only through cards.
- id: site.shenzhen_market_town
  name: { zh: 深圳墟, en: Shenzhen market town }
  kind: town
  area: 1
  geometry: { kind: point, lonlat: [114.1136, 22.5466], proxy: osm_shenzhen_places, confidence: 0.2 }
  in_start_state: block_stock
  placeholder: true
  claims:
    - { id: site.shenzhen_market_town.exists_1979, use: encyclopedia }
    - { id: site.shenzhen_market_town.location, use: geometry }
    - { id: phase1.map.shennan_1980, use: design_note }
  research: [Landsat 1979-10-19 built-up texture, USGS 1977 aerial (V15), Bao'an county gazetteer, period street maps]

