# Balance parameters for the Phase 1 slice (docs/design/systems/phase1-slice.md §5.2, §8).
# Every value here is a placeholder design guess (placeholder: true), chosen so the M2 loop behaves sensibly.
# None is a historical figure: wages, rents, m² per bed and build costs are open research targets (§9).
# Units: money in nominal yuan; wages per worker-month; rents per m² per month; floor in m².
# Sections for later milestones (production, climate, review, investors, readiness, sweep, corps) arrive with them.
# Keys are never years: seasonality uses month-of-year indices (0 = January), eras use ids.
placeholder: true

eras:
  - { id: slice_early, structural_max_floors: 4 }

labour:
  participation: { villager: 0.55, urban_resident: 0.5, migrant_factory: 0.95, migrant_construction: 0.95, hk_manager: 1.0 }
  # fill order per sector: who may take these jobs, in the order they are offered
  fill_order:
    state: [urban_resident]
    farming_fishing: [villager]
    factory: [migrant_factory, villager, urban_resident, hk_manager]
    construction: [migrant_construction, villager, urban_resident]
    services: [hk_manager, urban_resident, villager, migrant_factory]
  wage_start: { farming_fishing: 40, factory: 60, construction: 70, services: 50, state: 55 }
  wage_floor: { farming_fishing: 40, factory: 60, construction: 70, services: 50, state: 55 }
  wage_speed: 0.02                       # share of the wage per month, times (vacancy rate - unemployment rate)
  construction_jobs_per_m2: 0.02         # workers per m² under construction
  turnover_month: 0.02                   # R4 placeholder: share of a job row's migrant holders who quit to idle each month
  jobs_per_crew_unit: 1                  # R4: a crew unit is one worker-month (§5.6), so one job for the month

migration:
  inland_wage: 45                        # the reference wage migrants compare with
  base: { migrant_factory: 2300, migrant_construction: 1150 }   # people per month at gap 1, full pull, network 1
  sector: { migrant_factory: factory, migrant_construction: construction }
  pull_sectors:                          # R4 (§5.11): the sectors whose vacancies pull each kind (fill_order lets them in)
    migrant_factory: [factory, services]
    migrant_construction: [construction]
  K_vac: 200                             # vacancies at which the pull is one half
  network_alpha: 0.5
  K_net: 1000
  network_lag_months: 6
  permit_factor: { loose: 1.3, standard: 1.0, strict: 0.6 }
  base_exit: 0                           # per month. 0 so the start is a fixed point: exits come from unemployment and crowding
  unemployment_push: 0.2                 # per month, times the group's unemployment rate
  housing_push: 0.02                     # per month, times (crowding - 1) when above 1
  spring:
    away_months: [0, 1]                  # January and February
    away_share: 0.6
    nonreturn: 0                         # 0 for the same reason; only the unemployed stay home
    nonreturn_unemployment: 0.5          # added to the non-return share, times the unemployment rate

housing:
  m2_per_bed: { village_house: 16, state_flats: 14, village_rental: 7, dormitory: 5 }
  base_rent: 2.5                         # yuan per m² per month at crowding 1
  rent_elasticity: 2
  crowding_floor: 0.5                    # below this, crowding no longer lowers the target rent
  rent_speed: 0.15                       # share of the gap to the target closed each month
  crowding_max: 2.5                      # above this, the excess migrants leave

village_build:
  build_cost_per_m2: 150
  horizon_months: 60
  hurdle: 0.2                            # share of cost the margin must beat
  p_enforce: { low: 0.02, medium: 0.1, high: 0.3 }
  response: 0.5                          # share of the unmet rental beds started per month
  max_start_m2_per_villager_month: 0.5
  duration_months: 4
  legal_floors: 2
  enforcement_max_floors: { low: 4, medium: 3, high: 2 }

zoning:
  names:                                 # when a zone takes a historical zone's name (§5.3): labels only
    min_overlap: 0.25                    # share of the precedent's cells the zone covers
    max_offset_cells: 10                 # or: centroids at most this far apart
    max_scale_ratio: 3                   # zone cells ÷ precedent cells within [1/3, 3]
    weights: { overlap: 0.5, offset: 0.25, scale: 0.25 }

industry:                                # M3b (§5.5): firms, production and value added. All placeholders
  max_far: 1.0                           # floor m² per m² of buildable zone land (a cell is 10,000 m²)
  premises_jobs_per_area: 150            # jobs in existing premises per area (small processing contracts)
  premises_output_factor: 0.8            # existing premises produce a little less than a new factory
  order_index: 1                         # flat until M5's Hong Kong demand series
  by_ownership:
    hk_processing: { output_per_job_month: 520, value_added_ratio: 0.2, export_share: 1,
                     floor_m2_per_job: 10, power_kw_per_job: 0.5, water_m3_day_per_job: 0.1 }
    inland_soe:    { output_per_job_month: 200, value_added_ratio: 0.35, export_share: 0.2,
                     floor_m2_per_job: 15, power_kw_per_job: 0.8, water_m3_day_per_job: 0.2 }
    # M5a (§5.7): the SEZ's new origins
    joint_venture: { output_per_job_month: 350, value_added_ratio: 0.3, export_share: 0.7,
                     floor_m2_per_job: 12, power_kw_per_job: 0.8, water_m3_day_per_job: 0.15 }
    foreign_owned: { output_per_job_month: 400, value_added_ratio: 0.3, export_share: 0.8,
                     floor_m2_per_job: 12, power_kw_per_job: 1.0, water_m3_day_per_job: 0.15 }
    overseas_chinese: { output_per_job_month: 300, value_added_ratio: 0.25, export_share: 0.8,
                     floor_m2_per_job: 10, power_kw_per_job: 0.6, water_m3_day_per_job: 0.12 }
    # R10b (phase1-slice §5.13): local collectives (集体), small workshops selling mostly at home. Placeholders
    local_collective: { output_per_job_month: 160, value_added_ratio: 0.3, export_share: 0.1,
                     floor_m2_per_job: 12, power_kw_per_job: 0.4, water_m3_day_per_job: 0.1 }

investors:                               # M3b (§5.5): offers by archetype (content/slice/investors.yaml). Placeholders
  offer_months: 6                        # an offer outlives a quarter: runQuarter does not stop between months
  # R3 (b&c §13.3): routine cards are rarer, exceptional deals; ordinary firms now come without a card (growth below).
  # Every rate was cut to about a third of its M3b/M5a value (0.4, 0.1, 0.3, 0.15, 0.25 a quarter). Placeholders
  archetypes:
    investor.hk_processing:     { rate_per_quarter: 0.12, jobs: [60, 200], dorm_beds_per_job: 0.3, build_months: 9, ramp_months: 3 }
    investor.inland_state_unit: { rate_per_quarter: 0.04, jobs: [100, 400], dorm_beds_per_job: 0.5, build_months: 12, ramp_months: 6 }
    # M5a (§5.7): arrive only once the SEZ unlocks them.
    # tax_holiday_months: no value-added tax in a firm's first months open (absent = 0)
    investor.joint_venture:     { rate_per_quarter: 0.1, jobs: [100, 400], dorm_beds_per_job: 0.4, build_months: 12, ramp_months: 6,
                                  tax_holiday_months: 24 }
    investor.foreign_owned:     { rate_per_quarter: 0.05, jobs: [150, 500], dorm_beds_per_job: 0.3, build_months: 12, ramp_months: 6,
                                  tax_holiday_months: 24 }
    investor.overseas_chinese:  { rate_per_quarter: 0.08, jobs: [60, 250], dorm_beds_per_job: 0.3, build_months: 9, ramp_months: 3,
                                  tax_holiday_months: 12 }

# ---- M4 (§5.6): fiscal, projects, construction capacity and GDP. Every number is a placeholder design guess ----
# Money is nominal yuan per month unless named per year. The slice's ledger is the city's books for the slice's
# economy plus the county's existing taxes and administration (the county_base lines), flat in Phase 1.
fiscal:
  start_regime: regime.county_1979       # content/slice/fiscal_regimes.yaml; M5 switches it at the SEZ event
  start_balances: { general: 300000, land: 0, debt: 0, forex_usd: 50000 }   # general is the reserve
  # Tuned, not sourced (fiscal §4.2): at the start, county_base_revenue plus the grant covers the baselines with a
  # surplus, so the grant cliff of 1983–84 (the regime content's schedule) opens the first recurring gap.
  provincial_base_grant_per_year: 1380000
  county_base_revenue_per_month: 168000  # the town's and county's existing taxes and fees
  county_base_obligations_per_month: 100000   # county administration beyond the per-head baselines
  admin_per_resident_month: 1            # per resident (stayed six months)
  police_per_present_month: 0.3          # per person present
  sanitation_per_m2_month: 0.01          # per m² of completed floor
  collection_efficiency: 0.9
  reserve_months: 1                      # projects never draw general below this many months of obligations due
  forex: { retention_share: 0.1, yuan_per_usd: 1.5 }   # share of exports retained as quota; conversion for it
  short_loan: { revenue_multiple: 0.5, rate_month: 0.006, term_months: 24 }   # the deficit card's borrowing
  austerity_max_cut: 0.3                 # share of baselines, payroll and service a month may leave unpaid
  loan: { principal: 3000000, rate_month: 0.004, grace_months: 24, term_months: 60, offer_months: 6 }   # the state-bank project loan; the offer outlives a quarter
  cancel_penalty: 0.1                    # share of a cancelled project's unspent budget, owed in the month it is cancelled
  # R8c (phase1-slice §5.5): purchased power joins the city pool after lead_months, each kW a permanent monthly
  # service obligation from then; max_kw is the line's limit. Placeholders (design_note), to be replaced when the source
  # (Hong Kong or Guangdong) and its terms have claims: data/evidence/claims/phase1_power_supply.yaml holds only leads.
  power_import: { yuan_per_kw_month: 8, lead_months: 3, max_kw: 4500 }   # R9.1: max_kw was 3000; the line bridges the 1982 station

capacity:                                # the construction-capacity pool (§5.6), in crew units (organised worker-months)
  local_crew: 600                        # R9 (§5.6): the county's core; arrivals add to it. A placeholder set against the 1979 spending floor
  crew_per_m2: 0.02                      # a firm cohort's crew at full pace, per m²

power:                                   # R9.2 (§5.5): the consumption series, for calibration only. Placeholders.
  consumption:
    hours_month: 730                     # hours in a month
    firm_load_factor: 0.35               # average firm load as a share of connected kW (one to two shifts)
    kwh_person_month: 8                  # households, per person present
    kwh_job_month: 60                    # the base economy: state, farming, services and existing industry, per filled job

construction:
  cost_per_m2: { standard_factory: 120, dormitory: 100, state_flats: 110, shop_market: 110 }   # value of the work, for GDP

projects:                                # by template id (content/slice/projects.yaml)
  project.road_link:        { budget: 1100000, crew: 40, work_months: 6, maint_rate_year: 0.02, road_km: 2 }
  project.water_main:       { budget: 400000, crew: 30, work_months: 5, maint_rate_year: 0.02, water_m3_day: 200 }
  project.power_line:       { budget: 500000, crew: 25, work_months: 6, maint_rate_year: 0.02, power_kw: 500, forex_usd: 20000 }
  project.site_preparation: { budget_per_cell: 130000, crew_per_cell: 10, work_months: 4, maint_rate_year: 0.01 }
  project.school:           { budget: 300000, crew: 20, work_months: 8, maint_rate_year: 0.03,
                              school_places: 400, staff: 12, service_per_place_month: 0.5 }

teams:                                   # by team id (content/slice/teams.yaml). Not any historical headcount
  team.county_crew:       { crew: 60, mobilization_months: 1, duration_months: 12, cost_per_month: 0 }
  team.engineering_corps: { crew: 900, mobilization_months: 2, duration_months: 12, cost_per_month: 20000 }   # R9: the 1982 arrival
  team.outside_soe:       { crew: 120, mobilization_months: 2, duration_months: 12, cost_per_month: 30000 }
  team.corps_advance:     { crew: 100, mobilization_months: 0, duration_months: 9, cost_per_month: 0 }   # R9: a permanent arrival
  team.investment_corps:  { crew: 400, mobilization_months: 0, duration_months: 12, cost_per_month: 0 }   # R9.2: the 1982 programme's crews
  team.sez_builders:      { crew: 150, mobilization_months: 0, duration_months: 12, cost_per_month: 0 }   # R9: with the SEZ

works:                                   # R2 municipal works orders (buildings-and-construction §13.2). Placeholders taken
                                         # from the M4 templates' rates above, not sourced. Units are crew units (worker-months)
  crew_per_order: 40                     # the most units one order takes in a month
  maint_rate_year: 0.02                  # R4 (phase1-slice §5.11): a done order's maintenance a year, on its spending (project.road_link's rate)
  # R9 (phase1-slice §5.6, revision plan §4.6): works pace. A step's crew units per unit of work and its money per unit,
  # times the normal rate: a rushed order takes fewer crew-months and more yuan. Placeholders (design_note), not figures
  pace:
    normal:  { units: 1,    money: 1 }
    push:    { units: 0.75, money: 1.25 }
    all_out: { units: 0.55, money: 1.6 }
  service: { units_per_cell: 40, yuan_per_cell: 30000 }   # project.site_preparation: 10 crew × 4 months; budget_per_cell
  road:    { units_per_cell: 12, yuan_per_cell: 30000 }    # project.road_link over its 2 km (20 cells): 40 × 6 ÷ 20; 600,000 ÷ 20
  bridge:  { units_per_cell: 48, yuan_per_cell: 120000 }   # a guess: four road cells, at a road's yuan per unit
  # R8d (phase1-slice §5.12): road tiers. A class costs its units at the road's yuan per unit (street = works.road);
  # capacity is freight tonnes a month along a path. Placeholders (design_note): design settings, not historical figures
  roads:
    classes:
      track:  { units_per_cell: 6,  capacity_t_month: 2000 }
      street: { units_per_cell: 12, capacity_t_month: 8000 }
      avenue: { units_per_cell: 18, capacity_t_month: 30000 }
  structures:
    water_source: { units: 150, yuan: 150000, capacity: 500 }                     # project.water_main: 30 × 5; m³/day
    power_source: { units: 150, yuan: 200000, capacity: 1000, forex_usd: 10000 }   # project.power_line: 25 × 6; kW
    # R8c (phase1-slice §5.5): water and the one-quarter power source are no longer offered. Placeholders, not sourced
    power_substation: { units: 60, yuan: 100000, capacity: 2000, forex_usd: 10000 }   # distribution only: kW it can deliver along the roads
    power_station: { units: 720, yuan: 1500000, capacity: 6000, build_months: 24 }   # generation for the pool; 30 crew a month
  facilities:
    school: { units: 160, yuan: 300000, capacity: 400, staff: 12, service_per_place_month: 0.5 }   # project.school: 20 × 8; places, staff and service


# R8d (phase1-slice §5.12): freight through the gateways (content/slice/gateways.yaml). Placeholders (design_note): no
# number here is a historical volume. Exports are tonnes per yuan of a firm's exports; inputs come from Hong Kong at
# input_ratio of the export tonnes; materials come from the mainland by rail, per crew unit at work.
freight:
  yard_cells: 6                          # a gateway's yard: road cells within this many cells (Manhattan) of its cell
  t_per_crew_month: 2
  by_archetype:
    investor.hk_processing:     { t_per_yuan: 0.003, mode: rail, input_ratio: 0.3 }
    organic.small_processing:   { t_per_yuan: 0.003, mode: rail, input_ratio: 0.3 }
    investor.inland_state_unit: { t_per_yuan: 0.004, mode: rail, input_ratio: 0.3 }
    investor.joint_venture:     { t_per_yuan: 0.002, mode: rail, input_ratio: 0.3 }
    investor.foreign_owned:     { t_per_yuan: 0.002, mode: rail, input_ratio: 0.3 }
    investor.overseas_chinese:  { t_per_yuan: 0.003, mode: road, input_ratio: 0.3 }   # fresh food and light goods by lorry

growth:                                  # R3 organic growth (buildings-and-construction §13.3). Placeholder design guesses,
                                         # not sourced. None of these is a growth multiplier; R6 measures what they give
  pool_priority: low                     # private and work-unit builds take the pool after the city's normal work
  response: 0.5                          # share of a floor gap started in a month
  build_months: 6                        # a shop or dormitory cohort's months of work
  spend_share: 0.4                       # share of wages spent in the slice
  far: { industrial: 1.0, commercial: 1.5, residential: 1.5 }   # floor m² per m² of developable land
  intensity:                             # R8b (phase1-slice §5.3): a zone tier's multiples. Placeholders, design_note:
                                         # set so no tier is cheapest per m² of floor in money, work and power at once
    low:      { far: 0.6, formation_cost: 0.7, formation_work: 0.5, power: 0.8 }
    standard: { far: 1.0, formation_cost: 1.0, formation_work: 1.0, power: 1.0 }
    high:     { far: 1.8, formation_cost: 1.6, formation_work: 1.5, power: 1.3 }
  industrial:                            # small Hong Kong processing firms that build and occupy their own premises
    archetype: organic.small_processing  # the firms' archetype id; not an investor card
    firm: { dorm_beds_per_job: 0.3, build_months: 5, ramp_months: 2 }   # as an investors.archetypes entry; R9.1: 6/3
    ownership: hk_processing
    firm_jobs: 120                       # one organic firm: 1,200 m² of factory and 180 m² of dormitory; R10b: was 500
    floor_m2_per_month: 4500             # m² of demand a month at order index 1 and regime factor 1; R9.1: 6000 → 8000; R10b: 4500
    min_utility_share: 0.3               # no firm builds where its area's supply would fall below this share
    regime_factor: { default: 1, regime.county_1979: 0.4 }   # by fiscal regime id: the SEZ's regime favours firms (R9.1)
    max_backlog_m2: 40000                # R9 (b&c §13.3): no new organic firm in a zone with more floor under construction (placeholder)
  collective:                            # R10b (phase1-slice §5.13): local collectives (集体), workshop-sized, domestic sales
    archetype: organic.local_collective  # no freight entry: they sell at home by the old ways
    firm: { dorm_beds_per_job: 0.1, build_months: 4, ramp_months: 2 }
    ownership: local_collective
    firm_jobs: 60                        # 720 m² of workshop and 30 m² of dormitory
    floor_m2_per_month: 1500             # placeholder
    min_utility_share: 0.3
    regime_factor: { default: 0.6, regime.county_1979: 1 }   # strongest before the SEZ's contracting regime
    max_backlog_m2: 12000                # about 16 workshops building in one zone (placeholder)
  services:
    spend_per_job_month: 25              # local spending that supports one service job (yuan a month); R10b: was 60
    formal_share: 0.5                    # share of new service jobs that want shop floor; the rest is informal
    m2_per_job: 15                       # shop floor per formal service job
    tax_rate: 0.05                       # R4 placeholder, not sourced: tax on a staffed formal post's value added
  residential:
    min_crowding: 1.0                    # work units build dormitories only where rental crowding is at least this
  village_shops:
    m2_per_job: 10                       # village shop floor per informal service job
  land_cover:                            # R8a (phase1-slice §5.5): per formable class, placeholders, not sourced. `cost` scales
                                         # a cell's site-formation units (so its money); `compensation` is a one-off multiple of
                                         # works.service.yuan_per_cell, owed on commit. Villages, water, tidal flats, hills: not formable.
                                         # Compensation is half the revision plan's first table (R8a tuning: m6-tuning-log.md)
    upland:       { cost: 1.6, compensation: 0.25 }  # cut and fill; scrub, orchards, lychee and bamboo
    lowland_farm: { cost: 1.2, compensation: 1.0 }   # villagers' fields; drain first
    pond:         { cost: 1.8, compensation: 1.25 }  # fishponds; fill and drain
    town:         { cost: 1.2, compensation: 1.5 }   # the town fringe; existing users move

gdp:                                     # nominal value added (fiscal §8.2)
  base_va_per_job_month: { farming_fishing: 30, factory: 50, construction: 50, services: 50, state: 50 }   # R10b: services 40, state 45
  construction_va_ratio: 0.35            # fiscal §12's starting guess

# ---- M5a (§5.7): events, readiness, the SEZ's priorities, Shekou and the shortcut. Placeholder design guesses ----
events:                                  # by event id (content/slice/events.yaml)
  event.first_processing_contract: { jobs: 120 }   # fits one area's existing premises (premises_jobs_per_area)
  # M5b (§5.8). cost: yuan, a one-month transfer; scrutiny and standing: points on 0..100; orders: factor and months
  event.typhoon: { cost: 120000, scrutiny: 6 }       # repair now, or leave the damage to be seen
  event.corps_advance: { cost: 60000, scrutiny: 4 }  # build quarters, or the crews live in tents
  event.cofinancing: { jobs: 150, tax_holiday_months: 24, land_fee_factor: 0.5 }   # the investor's concession
  event.readiness_check: { cost: 100000 }            # the rush: overtime and imported parts
  event.first_zone: { standing: 5 }
  event.mandate_met: { standing: 5 }
  event.orders_surge: { jobs: 150 }                  # a Hong Kong firm wants capacity now: an extra offer
  event.orders_slump: { factor: 0.7, months: 6 }     # Hong Kong orders x 0.7 for six months
  event.fire: { cost: 80000, scrutiny: 8 }
  event.escapes: { cost: 40000, scrutiny: 6 }        # patrols, or the province hears of it
  event.petition: { cost: 100000, scrutiny: 6 }      # top up the compensation, or let it go up the line
  # R9 (§5.8, revision plan §4.4): timed modifiers. Placeholders (design_note): the record's text states the political
  # fact, never these numbers. A factor field is named by its target (or the effect's factor:), the length by months:
  news.1981q4.chenyun: { investor_rate: 0.9, months: 6 }
  news.1982q1.concession_material: { investor_rate: 0.75, scrutiny_gain: 1.5, months: 9 }
  event.1982q1.concession_storm: { shift_honest: -3, shift_numbers: 3, scrutiny: 5 }   # the public answer's cost
  news.1982q4.storm_passes: { investor_rate: 1.2, months: 12 }
  news.1983q3.strike_hard: { scrutiny_gain: 1.25, months: 12 }
  event.1983q4.rectification: { follow: 1.1, strict: 0.8, transmit: 1.3, months: 6 }   # scrutiny_gain by option
  event.1981q1.slogan: { cohort_crew: 0.9, months: 9, standing: 2 }   # endorsing: the private builders work faster
  event.investment_programme: { investor_rate: 1.2, months: 12, cost: 150000 }   # R9.2: the 1982 push

readiness:                               # one bar of three parts over the readiness cells (§7.1)
  areas: [1, 2, 3, 7]                    # the market town, Luohu, Caiwuwei and Shangbu
  weights: { roads: 0.3, serviced_land: 0.35, water_power: 0.35 }
  road_reach_cells: 5                    # a km of road reaches (2 × 5 + 1) × 10 cells of its area
  # the parts are full at these shares of the 1,519 readiness cells: about 456 cells by road (two road links)
  # and about 15 serviced cells (one site-preparation project the size of a small zone)
  full_at: { roads: 0.3, serviced_land: 0.01 }
  standard_wave: { ownership: joint_venture, jobs: 2000 }   # its power need is above the start's spare power
  first_wave: { min_cards: 1, max_cards: 4 }

sez:
  priorities:                            # the first wave's archetype weights by first priority (§7.1 step 2)
    # every investor is a factory until service-sector investors arrive, so trade and commerce steer the origins only
    priority.industry: { investor.hk_processing: 2, investor.joint_venture: 2, investor.foreign_owned: 1,
                         investor.overseas_chinese: 1, investor.inland_state_unit: 1 }
    priority.trade:    { investor.hk_processing: 3, investor.joint_venture: 1, investor.foreign_owned: 1,
                         investor.overseas_chinese: 2 }
    priority.commerce: { investor.hk_processing: 1, investor.joint_venture: 1, investor.foreign_owned: 1,
                         investor.overseas_chinese: 3 }

shekou:
  capture_share: 0.5                     # share of the investors the player loses that Shekou takes

shortcut:                                # the deal-maker's shortcut card (leadership §2.4-§2.5)
  discipline_weight: 10                  # disciplineRisk per accepted shortcut
  rapport_on_decline: 5                  # the Mayor's rapport lost when the player declines
  land_fee_factor: 0.5                   # the sweetheart price: share of the land-use fee the firm pays
  extra_tax_holiday_months: 24           # added to the archetype's tax holiday

# ---- M5b (§5.8): the climate, the sweep, the annual review and the fall from grace. Placeholder design guesses ----
climate:
  reform_wind: 0                         # §5's exogenous series in -1..1 (§6.9); flat and neutral in the slice
  scrutiny_decay: 0.05                   # share of scrutiny that fades each month
  failure_threshold: 80                  # quarters ending above this count toward the failure state
  failure_quarters: 4
  permit_factor: { loose: 1.5, standard: 1, strict: 0.7 }   # how hard the province looks under each permit regime
  gain:                                  # scrutiny points a month, before the permit factor
    loose_permit: 1                      # a month under the loose regime
    illegal_share: 4                     # × the real illegal-floor share
