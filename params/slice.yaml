# Balance parameters for the Phase 1 slice (docs/design/systems/phase1-slice.md §5.2, §8).
# Every value here is a placeholder design guess (placeholder: true), chosen so the M2 loop behaves sensibly.
# None is a historical figure: wages, rents, m² per bed and build costs are open research targets (§9).
# Units: money in nominal yuan; wages per worker-month; rents per m² per month; floor in m².
# Sections for later milestones (production, climate, review, investors, readiness, sweep, corps) arrive with them.
# Keys are never years: seasonality uses month-of-year indices (0 = January), eras use ids.
placeholder: true

eras:
  - { id: slice_early, structural_max_floors: 4 }

labour:
  participation: { villager: 0.55, urban_resident: 0.5, migrant_factory: 0.95, migrant_construction: 0.95, hk_manager: 1.0 }
  # fill order per sector: who may take these jobs, in the order they are offered
  fill_order:
    state: [urban_resident]
    farming_fishing: [villager]
    factory: [migrant_factory, villager, urban_resident, hk_manager]
    construction: [migrant_construction, villager, urban_resident]
    services: [hk_manager, urban_resident, villager, migrant_factory]
  wage_start: { farming_fishing: 40, factory: 60, construction: 70, services: 50, state: 55 }
  wage_floor: { farming_fishing: 40, factory: 60, construction: 70, services: 50, state: 55 }
  wage_speed: 0.02                       # share of the wage per month, times (vacancy rate - unemployment rate)
  construction_jobs_per_m2: 0.02         # workers per m² under construction

migration:
  inland_wage: 45                        # the reference wage migrants compare with
  base: { migrant_factory: 600, migrant_construction: 300 }   # people per month at gap 1, full pull, network 1
  sector: { migrant_factory: factory, migrant_construction: construction }
  K_vac: 500                             # vacancies at which the pull is one half
  network_alpha: 0.5
  K_net: 1000
  network_lag_months: 6
  permit_factor: { loose: 1.3, standard: 1.0, strict: 0.6 }
  base_exit: 0                           # per month. 0 so the start is a fixed point: exits come from unemployment and crowding
  unemployment_push: 0.2                 # per month, times the group's unemployment rate
  housing_push: 0.1                      # per month, times (crowding - 1) when above 1
  spring:
    away_months: [0, 1]                  # January and February
    away_share: 0.6
    nonreturn: 0                         # 0 for the same reason; only the unemployed stay home
    nonreturn_unemployment: 0.5          # added to the non-return share, times the unemployment rate

housing:
  m2_per_bed: { village_house: 16, state_flats: 14, village_rental: 7, dormitory: 5 }
  base_rent: 2.5                         # yuan per m² per month at crowding 1
  rent_elasticity: 2
  crowding_floor: 0.5                    # below this, crowding no longer lowers the target rent
  rent_speed: 0.15                       # share of the gap to the target closed each month
  crowding_max: 1.6                      # above this, the excess migrants leave

village_build:
  build_cost_per_m2: 150
  horizon_months: 60
  hurdle: 0.2                            # share of cost the margin must beat
  p_enforce: { low: 0.02, medium: 0.1, high: 0.3 }
  response: 0.5                          # share of the unmet rental beds started per month
  max_start_m2_per_villager_month: 0.5
  duration_months: 4
  legal_floors: 2
  enforcement_max_floors: { low: 4, medium: 3, high: 2 }

zoning:
  names:                                 # when a zone takes a historical zone's name (§5.3): labels only
    min_overlap: 0.25                    # share of the precedent's cells the zone covers
    max_offset_cells: 10                 # or: centroids at most this far apart
    max_scale_ratio: 3                   # zone cells ÷ precedent cells within [1/3, 3]
    weights: { overlap: 0.5, offset: 0.25, scale: 0.25 }

industry:                                # M3b (§5.5): firms, production and value added. All placeholders
  max_far: 1.0                           # floor m² per m² of buildable zone land (a cell is 10,000 m²)
  premises_jobs_per_area: 150            # jobs in existing premises per area (small processing contracts)
  premises_output_factor: 0.8            # existing premises produce a little less than a new factory
  order_index: 1                         # flat until M5's Hong Kong demand series
  by_ownership:
    hk_processing: { output_per_job_month: 400, value_added_ratio: 0.2, export_share: 1,
                     floor_m2_per_job: 10, power_kw_per_job: 0.5, water_m3_day_per_job: 0.1 }
    inland_soe:    { output_per_job_month: 200, value_added_ratio: 0.35, export_share: 0.2,
                     floor_m2_per_job: 15, power_kw_per_job: 0.8, water_m3_day_per_job: 0.2 }
    # M5a (§5.7): the SEZ's new origins
    joint_venture: { output_per_job_month: 350, value_added_ratio: 0.3, export_share: 0.7,
                     floor_m2_per_job: 12, power_kw_per_job: 0.8, water_m3_day_per_job: 0.15 }
    foreign_owned: { output_per_job_month: 400, value_added_ratio: 0.3, export_share: 0.8,
                     floor_m2_per_job: 12, power_kw_per_job: 1.0, water_m3_day_per_job: 0.15 }
    overseas_chinese: { output_per_job_month: 300, value_added_ratio: 0.25, export_share: 0.8,
                     floor_m2_per_job: 10, power_kw_per_job: 0.6, water_m3_day_per_job: 0.12 }

investors:                               # M3b (§5.5): offers by archetype (content/slice/investors.yaml). Placeholders
  offer_months: 6                        # an offer outlives a quarter: runQuarter does not stop between months
  archetypes:
    investor.hk_processing:     { rate_per_quarter: 0.4, jobs: [60, 200], dorm_beds_per_job: 0.3, build_months: 9, ramp_months: 3 }
    investor.inland_state_unit: { rate_per_quarter: 0.1, jobs: [100, 400], dorm_beds_per_job: 0.5, build_months: 12, ramp_months: 6 }
    # M5a (§5.7): arrive only once the SEZ unlocks them. With the two above, about one card a quarter (§6.5).
    # tax_holiday_months: no value-added tax in a firm's first months open (absent = 0)
    investor.joint_venture:     { rate_per_quarter: 0.3, jobs: [100, 400], dorm_beds_per_job: 0.4, build_months: 12, ramp_months: 6,
                                  tax_holiday_months: 24 }
    investor.foreign_owned:     { rate_per_quarter: 0.15, jobs: [150, 500], dorm_beds_per_job: 0.3, build_months: 12, ramp_months: 6,
                                  tax_holiday_months: 24 }
    investor.overseas_chinese:  { rate_per_quarter: 0.25, jobs: [60, 250], dorm_beds_per_job: 0.3, build_months: 9, ramp_months: 3,
                                  tax_holiday_months: 12 }

# ---- M4 (§5.6): fiscal, projects, construction capacity and GDP. Every number is a placeholder design guess ----
# Money is nominal yuan per month unless named per year. The slice's ledger is the city's books for the slice's
# economy plus the county's existing taxes and administration (the county_base lines), flat in Phase 1.
fiscal:
  start_regime: regime.county_1979       # content/slice/fiscal_regimes.yaml; M5 switches it at the SEZ event
  start_balances: { general: 300000, land: 0, debt: 0, forex_usd: 50000 }   # general is the reserve
  # Tuned, not sourced (fiscal §4.2): at the start, county_base_revenue plus the grant covers the baselines with a
  # surplus of about ¥10,000 a month, so the grant cliff of 1983–84 (the regime content's schedule) opens a gap.
  provincial_base_grant_per_year: 1380000
  county_base_revenue_per_month: 130000  # the town's and county's existing taxes and fees
  county_base_obligations_per_month: 150000   # county administration beyond the per-head baselines
  admin_per_resident_month: 2            # per resident (stayed six months)
  police_per_present_month: 0.5          # per person present
  sanitation_per_m2_month: 0.02          # per m² of completed floor
  collection_efficiency: 0.8
  reserve_months: 1                      # projects never draw general below this many months of obligations due
  forex: { retention_share: 0.1, yuan_per_usd: 1.5 }   # share of exports retained as quota; conversion for it
  short_loan: { revenue_multiple: 0.25, rate_month: 0.008, term_months: 12 }   # the deficit card's borrowing
  austerity_max_cut: 0.2                 # share of baselines, payroll and service a month may leave unpaid
  loan: { principal: 3000000, rate_month: 0.004, grace_months: 24, term_months: 60, offer_months: 6 }   # the state-bank project loan; the offer outlives a quarter
  cancel_penalty: 0.1                    # share of a cancelled project's unspent budget, owed in the month it is cancelled

capacity:                                # the construction-capacity pool (§5.6), in crew units (organised worker-months)
  local_crew: 120                        # the county's own builders. Not either observed local count (§5.6 research)
  crew_per_m2: 0.02                      # a firm cohort's crew at full pace, per m²

construction:
  cost_per_m2: { standard_factory: 120, dormitory: 100, state_flats: 110 }   # value of the work, for GDP

projects:                                # by template id (content/slice/projects.yaml)
  project.road_link:        { budget: 600000, crew: 40, work_months: 6, maint_rate_year: 0.02, road_km: 2 }
  project.water_main:       { budget: 400000, crew: 30, work_months: 5, maint_rate_year: 0.02, water_m3_day: 200 }
  project.power_line:       { budget: 500000, crew: 25, work_months: 6, maint_rate_year: 0.02, power_kw: 500, forex_usd: 20000 }
  project.site_preparation: { budget_per_cell: 100000, crew_per_cell: 10, work_months: 4, maint_rate_year: 0.01 }
  project.school:           { budget: 300000, crew: 20, work_months: 8, maint_rate_year: 0.03,
                              school_places: 400, staff: 12, service_per_place_month: 0.5 }

teams:                                   # by team id (content/slice/teams.yaml). Not any historical headcount
  team.county_crew:       { crew: 60, mobilization_months: 1, duration_months: 12, cost_per_month: 0 }
  team.engineering_corps: { crew: 200, mobilization_months: 2, duration_months: 12, cost_per_month: 20000 }
  team.outside_soe:       { crew: 120, mobilization_months: 2, duration_months: 12, cost_per_month: 30000 }
  team.corps_advance:     { crew: 60, mobilization_months: 0, duration_months: 9, cost_per_month: 0 }   # M5b: paid centrally

gdp:                                     # nominal value added (fiscal §8.2)
  base_va_per_job_month: { farming_fishing: 30, factory: 50, construction: 50, services: 40, state: 45 }
  construction_va_ratio: 0.35            # fiscal §12's starting guess

# ---- M5a (§5.7): events, readiness, the SEZ's priorities, Shekou and the shortcut. Placeholder design guesses ----
events:                                  # by event id (content/slice/events.yaml)
  event.first_processing_contract: { jobs: 120 }   # fits one area's existing premises (premises_jobs_per_area)
  # M5b (§5.8). cost: yuan, a one-month transfer; scrutiny and standing: points on 0..100; orders: factor and months
  event.typhoon: { cost: 120000, scrutiny: 6 }       # repair now, or leave the damage to be seen
  event.corps_advance: { cost: 60000, scrutiny: 4 }  # build quarters, or the crews live in tents
  event.cofinancing: { jobs: 150, tax_holiday_months: 24, land_fee_factor: 0.5 }   # the investor's concession
  event.readiness_check: { cost: 100000 }            # the rush: overtime and imported parts
  event.first_zone: { standing: 5 }
  event.mandate_met: { standing: 5 }
  event.orders_surge: { jobs: 150 }                  # a Hong Kong firm wants capacity now: an extra offer
  event.orders_slump: { factor: 0.7, months: 6 }     # Hong Kong orders x 0.7 for six months
  event.fire: { cost: 80000, scrutiny: 8 }
  event.escapes: { cost: 40000, scrutiny: 6 }        # patrols, or the province hears of it
  event.petition: { cost: 100000, scrutiny: 6 }      # top up the compensation, or let it go up the line

readiness:                               # one bar of three parts over the readiness cells (§7.1)
  areas: [1, 2, 3, 7]                    # the market town, Luohu, Caiwuwei and Shangbu
  weights: { roads: 0.3, serviced_land: 0.35, water_power: 0.35 }
  road_reach_cells: 5                    # a km of road reaches (2 × 5 + 1) × 10 cells of its area
  # the parts are full at these shares of the 1,519 readiness cells: about 456 cells by road (two road links)
  # and about 15 serviced cells (one site-preparation project the size of a small zone)
  full_at: { roads: 0.3, serviced_land: 0.01 }
  standard_wave: { ownership: joint_venture, jobs: 2000 }   # its power need is above the start's spare power
  first_wave: { min_cards: 1, max_cards: 4 }

sez:
  priorities:                            # the first wave's archetype weights by first priority (§7.1 step 2)
    # every investor is a factory until service-sector investors arrive, so trade and commerce steer the origins only
    priority.industry: { investor.hk_processing: 2, investor.joint_venture: 2, investor.foreign_owned: 1,
                         investor.overseas_chinese: 1, investor.inland_state_unit: 1 }
    priority.trade:    { investor.hk_processing: 3, investor.joint_venture: 1, investor.foreign_owned: 1,
                         investor.overseas_chinese: 2 }
    priority.commerce: { investor.hk_processing: 1, investor.joint_venture: 1, investor.foreign_owned: 1,
                         investor.overseas_chinese: 3 }

shekou:
  capture_share: 0.5                     # share of the investors the player loses that Shekou takes

shortcut:                                # the deal-maker's shortcut card (leadership §2.4-§2.5)
  discipline_weight: 10                  # disciplineRisk per accepted shortcut
  rapport_on_decline: 5                  # the Mayor's rapport lost when the player declines
  land_fee_factor: 0.5                   # the sweetheart price: share of the land-use fee the firm pays
  extra_tax_holiday_months: 24           # added to the archetype's tax holiday

# ---- M5b (§5.8): the climate, the sweep, the annual review and the fall from grace. Placeholder design guesses ----
climate:
  reform_wind: 50                        # §6.9's backdrop; flat in the slice
  scrutiny_decay: 0.05                   # share of scrutiny that fades each month
  failure_threshold: 80                  # quarters ending above this count toward the failure state
  failure_quarters: 4
  permit_factor: { loose: 1.5, standard: 1, strict: 0.7 }   # how hard the province looks under each permit regime
  gain:                                  # scrutiny points a month, before the permit factor
    loose_permit: 1                      # a month under the loose regime
    illegal_share: 4                     # × the real illegal-floor share
    grey_land_per_100k: 2                # per ¥100,000 of land money spent on recurring lines when it is not sanctioned
    shortcut: 5                          # per accepted shortcut

sweep:                                   # the pre-inspection sweep (§6.8, leadership §4.4)
  cash_cost: 50000
  mood_penalty: 0.1                      # off every migrant group's mood
  campaign_months: 3
  visible_cut: 0.5                       # share of illegal floor hidden from the review while it lasts
  base_p: 2                              # p_caught = min(1, base_p × (real − visible share))

review:                                  # the annual review (leadership §3)
  pass_mark: 0.6
  standing_pass: 10
  standing_fail: 10
  scrutiny_relief: 10
  scrutiny_fail: 10

fall:                                    # the fall from grace (leadership §2.6)
  base: 0.05                             # the monthly trip chance at a high risk
  k: 0.3
  threshold: 20                          # disciplineRisk at which the chance is half of base (two shortcuts)
  freeze_months: 6
  scrutiny: 15
