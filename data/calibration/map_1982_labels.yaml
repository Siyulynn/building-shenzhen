# Complete label transcription and georeferencing control points for the 1982 深圳市区图.
# Source image: data/raw/sources/phase1_1982_shenzhen_city_map/map_1982.jpg (2000x1500 px)
# Source record: data/evidence/sources/phase1_1982_shenzhen_city_map.yaml (tier D, reference_only)
#
# Caveats:
#   - Folded paper city map photographed at a slight angle; no scale, imprint or legend visible.
#   - Schematic city map: old-town blocks are slightly widened for legibility and Shangbu's grid is drawn orthogonal.
#   - Mixes existing features with planned works (e.g. 科学馆, 计划中水道).
#   - Affine georeferencing has ~201 m in-sample RMS (~2 grid cells) and ~332 m leave-one-out RMS.
#
# Categories:
#   building  named building, factory, office, school, hospital, station, depot or facility
#   village   village, hamlet, residential quarter or named locality
#   hill      named hill, peak or ridge
#   hydro     named river, pond, lake or planned waterway

