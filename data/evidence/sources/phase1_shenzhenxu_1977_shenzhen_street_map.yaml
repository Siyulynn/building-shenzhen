notes: "1:5,000 street sheet. Shows 渔民村, 罗湖, 文锦渡, 深圳站, 宝安县, 蔡屋围, 湖贝 and the Shenzhen River. Red boundary lines and 县革委/附城公社 labels appear on the sheet. The article pairs it with the 1977 county map. This is the closest detailed pre-1979 street source in the register."
