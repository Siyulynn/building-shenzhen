notes: "Reposted gallery of 22 captioned 1984 views. Several captions carry a day and a photographer (李长永, 刘玉生, 陈学思, 徐佑珠), which suggests original wire or agency captions, but the repost supplies no archive IDs, negative dates or per-image rights. The photographer names and dates are the basis for the claims; no local copy is recorded. Some views repeat a subject or are near-duplicates. Several captions use place-name variants (上埗 for 上步)."
