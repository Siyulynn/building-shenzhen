notes: "Detailed street plan published on the last page of 《深圳通讯（第七期）》 in July 1948. Shows 中山公園, 南塘村, 向南村, 上大街, 下大街, 深圳車站 and the surrounding lanes. The article calls it one of the earliest detailed street maps of 深圳墟. No scale or north arrow is visible in the copy."
