notes: >-
  Dated photograph looking north across 深南中路 at the 市委大院 gate, with the 孺子牛 sculpture and a six-storey
  white slab behind the gate. Public domain (author released it). The file page gives 2010-01-16 and no camera
  position; the direction is inferred from the road, the gate and the sculpture. The building behind the gate is
  partly hidden by trees, so this is not a usable elevation for modelling without a second view.
