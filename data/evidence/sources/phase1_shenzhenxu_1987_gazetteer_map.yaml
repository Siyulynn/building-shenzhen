notes: "Colour plate from the 1987 edition of 《深圳市地名志》, titled 深圳市成立前之宝安县城（深圳）（1953年—1978年）. Shows the county town before the SEZ: 宝安县, 深圳墟, 火车站, 罗湖山, 深圳河, 水稻田 and 鱼塘. Scale 1:25,000 is printed on the sheet. The map depicts the 1953–1978 period, not a single year. No overlay marks. This is the map attached in the M3 review."
