notes: "Aggregated retrospective gallery reposted by 深圳微时光. The captions give places and 1984 dates but no negative dates, archive IDs or per-image reuse terms; only the slogan photograph is credited, to 徐佑珠. Several street views have no identified location, and one caption visibly contains a typo ('布吉镇压宝声'). The images are hosted by Sohu; no local copy is recorded. Treat the captions as published assertions, not independent dating. Two images repeat: the Shenzhen Theatre view and the bicycle street view each appear twice."
