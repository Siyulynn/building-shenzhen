notes: >-
  Entity LM51210441984327FFF03, WRS-2 path 121 / row 044. The Level-1 archive
  contains four MSS bands and both QA GeoTIFFs on a 3895 by 3456 grid.
  MTL records 60 m pixels, WGS 84 / UTM 50N, scene centre time
  02:15:49.031 UTC, 0% scene and land cloud, and geometric model RMSE
  18.450 m. QA_PIXEL samples confirm useful coverage in eastern Shenzhen
  and fill or absence for the four western and central reference points.
  The band data stops at about UTM 50N E 205.3 km, further east than
  QA_PIXEL reports (docs/spikes/m1c-imagery.md).
