notes: "Bureau-centred feature on the sources of Shenzhen's electricity. States that provincial-grid power was the city's main source from August 1965 to 1987, names 1987 Shajiao B and the later local oil-fired and Mawan plants, and quotes the first bureau director on >60% annual growth and overloaded substations. The 70%-purchased-share figure is a 2021 system description, not a 1979-84 one."
