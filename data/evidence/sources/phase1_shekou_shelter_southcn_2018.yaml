notes: "Feature on the Shekou fishing harbour and typhoon shelter. It quotes 《蛇口志》 for the shelter's location and its 1953 expansion to 19,000 m², then reports a final area of 53,000 m² and a peak fleet of 1,600 boats. The article also records the shelter's 1993 infill and its later replacement by 蛇口广场. The original epaper URL is http://epaper.southcn.com/nfdaily/html/2018-05/31/content_7726914.htm; the opened copy is the Sohu reprint."
