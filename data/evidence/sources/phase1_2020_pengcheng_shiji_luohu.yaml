notes: >-
  Photo-led feature using images from 甲骨文传媒. The caption on two prints dates the jointly built new Lo Wu
  pedestrian bridge to 1981-01-15; the running text only says "1981". It also gives the 1985 double-deck
  pedestrian bridge as about 61 m long and 9.6 m wide, upper deck outbound and lower deck inbound. Captions,
  not archive records.
