notes: >-
  A 2000x1500 phone photograph of a folded paper city map, taken at a slight angle, reproduced in a 2021
  photo-identification article. The "1982" date is the article caption's, not an imprint: no publisher, scale,
  survey date or legend is visible in the photograph. It is a city map that labels streets, villages, factories
  and public buildings; because it also labels the 科学馆 (which may still have been planned in 1982), it may mix
  built and proposed features. Read it as a period map for relative positions, not as a survey of completed work.
  The paper original is not in an archive we have used; if one is found, this becomes a tier-B period map. Read
  from the HEIC original; the JPEG on the article is a smaller copy.
