# Leads for the slice's precedents (docs/design/systems/phase1-slice.md §5.3, §5.4): historical zones whose names
# can attach to the player's zones, and the named things the emergence engine may use later. All leads: no source
# page has been read for these statements. No dates or sizes are recorded here.

- id: precedent.zone.shangbu_industrial.exists
  origin: design_brief
  summary: The Shangbu Industrial Zone (上步工业区) was an industrial zone in the early SEZ.
  status: lead
  notes: >-
    Named in the design brief (2026-11-23). The research batch in progress names it on p. 363 of source
    phase1_1985_industrial_buildings (claims phase1.industry.shangbu.operating_or_trial_plants.1984 and
    phase1.housing.shangbu_bagualing.completed_industrial_floor.1984). Once that batch is committed, point source and
    locator at the page and capture a quote naming the zone. Its start date and extent are open.
- id: precedent.zone.shangbu_industrial.location
  source: osm_shenzhen_places
  locator: "way 588326736 (上步工业区, landuse=commercial), centre"
  summary: Proxy point for the Shangbu Industrial Zone at the present-day feature of that name.
  status: lead
  notes: Present-day position only. The template's 6 × 6 cell square around it is a placeholder footprint.

- id: precedent.zone.bagualing_industrial.exists
  origin: design_brief
  summary: The Bagualing Industrial Zone (八卦岭工业区) was an industrial zone in the early SEZ.
  status: lead
  notes: >-
    Named in the design brief (2026-11-23), and with Shangbu on p. 363 of phase1_1985_industrial_buildings in the research
    batch in progress. Its location is not in the store (the OSM export's query did not ask for it).

- id: precedent.zone.shuibei_industrial.exists
  origin: design_brief
  summary: The Shuibei Industrial Zone (水贝工业区) was one of Shenzhen's early industrial zones.
  status: lead
  notes: Named in the design brief (2026-11-23) as an early industrial zone. No source opened; start date and extent are open.
- id: precedent.zone.shuibei_industrial.location
  source: osm_shenzhen_places
  locator: "node 13019007378 (水贝社区, place=quarter)"
  summary: Proxy point for Shuibei at the present-day Shuibei quarter.
  status: lead
  notes: >-
    A second 水贝 point (node 1689942217) falls in slice area 6 rather than 1, and OSM's present-day 水贝石化工业区
    polygon carries a different name. Which, if any, matches the historical zone is open.

- id: precedent.landmark.wanjia_first_store
  origin: design_brief
  summary: The first Wanjia supermarket (万佳) opened in Shenzhen, possibly in or near Shangbu.
  status: lead
  notes: An example of named emergence from the design brief. Its date and place are not in the store; whether it falls inside 1979–83 is the first thing to check (§5.4).
- id: precedent.cluster.huaqiangbei_electronics
  source: phase1_shangbu_huaqiang_history
  locator: "title and opening section"
  summary: The Huaqiangbei electronics complex grew from the Shangbu industrial area into an electronics street.
  status: lead
  notes: An example of named emergence from the design brief. When the market or complex formed is open; the source's section 深圳电子工业肇启 may name in-window plants.
