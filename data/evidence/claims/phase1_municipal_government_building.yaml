- id: phase1.site.municipal_government.site_choice
  source: szbaike_2021_zhang_xunfu
  locator: "Passage beginning 第三件事，是要确定深圳市委、市府的所在地"
  quote: "后来我们看中一块地方，那里有很多荔枝树，还有一片低洼地。我们后来把这块凹地改为湖，就在荔枝园的旁边建设深圳市委、市政府的办公大楼。"
  summary: >-
    Zhang Xunfu recalled that the first municipal standing committee chose the office site beside a lychee orchard,
    with a low-lying hollow that was turned into a lake.
  status: sourced
  extracted_by: ai:opencode-municipal-government-research
  notes: >-
    A first-person retrospective. "荔枝园" is the lychee orchard that became 荔枝公园; the lake is the park lake.
    This is the earliest account of the siting decision and matches the 1982 map's position. It does not give a
    street or a construction date for the office block.

- id: phase1.site.municipal_government.occupation_early_1981
  source: szbaike_2021_zhang_xunfu
  locator: "Final sentence of the same passage"
  quote: "1979年5月就开始动工建设，到1981年初，就开始住人和办公了。"
  summary: >-
    Zhang Xunfu recalled that work on the cadre housing began in May 1979 and that people were living and working
    there by early 1981.
  date: { value: "1981", precision: year }
  status: sourced
  extracted_by: ai:opencode-municipal-government-research
  notes: >-
    The sentence follows the office-site passage but its subject is the 科技干部住宅 (cadre housing). "办公" may
    mean offices in the same compound, not the six-storey office block. It sits in tension with the memoir quoted
    by the blog, which dates the Party/government move to the end of 1981. Keep both; a person should decide
    whether the office block opened early or late in 1981, or whether the housing and offices opened at different
    times.

