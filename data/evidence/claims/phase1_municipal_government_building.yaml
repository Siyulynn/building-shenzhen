- id: phase1.site.municipal_government.1981_dorms
  source: phase1_sparktour_shenzhen_1980_2025
  locator: "荔枝公园 section, block quote, third and fourth sentences"
  quote: "干部宿舍建在办公楼后面的通心岭（现“通新岭”）上。最初只有5栋6层的水泥砖结构宿舍楼"
  summary: The cadre dormitories stood behind the office block at Tongxinling (now 通新岭) and began with five six-storey cement-brick blocks.
  status: sourced
  extracted_by: ai:opencode-municipal-government-research
  notes: >-
    "Behind" is relative to the office, i.e. north up the slope towards 红荔路. Five blocks is the initial
    estate, not its later extent. The same passage says the blocks were shared by several cadre households and
    that the area had frequent power and water cuts.

