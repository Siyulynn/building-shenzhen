# The 1981 Party/ government office block on 深南中路, its site, appearance and afterlife.
# Research note: docs/research/municipal-government-building.md.
# The building is not yet in the slice; these claims exist so a landmark, encyclopedia entry or walkable route
# can be built from evidence later.

- id: phase1.site.municipal_government.1981_move
  source: phase1_sparktour_shenzhen_1980_2025
  locator: "荔枝公园 section, block quote beginning 1981年年底"
  quote: "1981年年底，市委、市政府机关搬到上埗岭上新建的办公楼。"
  summary: At the end of 1981 the Party committee and municipal government organs moved into a newly built office block on 上埗岭.
  date: { value: "1981", precision: year }
  geography: "Shangbu / Tongxinling area, Futian"
  status: sourced
  extracted_by: ai:opencode-municipal-government-research
  notes: >-
    The blog reproduces a memoir passage without a page reference; the underlying 《文化深圳》 article was not
    opened. 1981年年底 means late December, but the date is kept at year precision. 上埗岭 is the memoir's name
    for the rise; it is not yet matched to a gazetteer entry or a 1982 map. The move date and the move itself
    need a second, independent source before use as an anchor date.

