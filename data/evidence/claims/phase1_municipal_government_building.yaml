- id: phase1.observation.kh9_1980.municipal_site_unbuilt
  source: kh9_1980_09_11_a048
  locator: "Segment c, r8 reduction; crop UTM 50N E 199.8-202.2 km, N 2,494.7-2,497.1 km, rendered at 3 m and 1.5 m with the c_georef.json inverse model"
  summary: >-
    The 1980-09-11 KH-9 frame shows the inferred 市委大院 block as cultivation, trees and small structures, with
    深南路 along its south edge and no large building or cleared construction pad.
  geography: "上步, 福田; approx. 22.543-22.546 N, 114.091-114.094 E"
  date: { value: "1980-09-11", precision: day }
  status: lead
  extracted_by: ai:opencode-municipal-government-research
  notes: >-
    AI reading of the registered frame, not a human check. The model's held-out RMSE is 27.8 m and the reduction
    is 7.5 m per pixel, so a 100 m building would be about 13 px; the crop can rule out a large completed block,
    not small works. Rendered crops: data/raw/sources/kh9_1980_09_11_a048/reduced/municipal_site_1980_wide.png
    and _close.png (git-ignored; regenerate with the locator's parameters). This is consistent with construction
    starting in 1981 and is the basis for saying the site was empty in September 1980.

