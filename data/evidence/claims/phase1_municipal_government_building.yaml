- id: phase1.site.municipal_government.1981_location
  origin: "inference from phase1.site.municipal_government.1981_move, phase1.site.municipal_government.address_2017 and present-day street geometry"
  summary: >-
    The 1981 block probably stood in the 市委大院 on the north side of 深南中路, between 上步中路 and the west edge
    of 荔枝公园, with the 通新岭 dormitories on the slope directly north.
  geography: "Approx. 22.544 N, 114.093 E; 通新岭社区, 华强北街道, 福田区"
  status: lead
  notes: >-
    The chain: the memoir puts the office on 上埗岭 with dorms behind at 通心岭; the 2017 notice puts the 市委大院
    at 深南中路1008号; OSM puts 通新岭社区 between 深南中路 (south), 红荔路 (north), 上步中路 (west) and 红岭中路
    (east), with 荔枝公园 filling its eastern half; the 2010 gate photographs are geotagged on the opposite side
    of 深南中路 at about 22.5435 N, 114.0931-114.0935 E; and the 1982 city map labels 深圳市人民政府 in the same
    block with 市委宿舍 north and 上步岭 east (phase1.map.1982.municipal_government_compound). The compound is
    therefore fixed; the block's surveyed footprint and floor plan remain open. The existing 1984 video claim's
    geography gloss, "old site on Shennan Middle Road", is unsourced and should be replaced by this chain.

- id: phase1.site.municipal_government.1981_survival
  source: phase1_2010_commons_sz_committee_gate
  locator: "Whole frame, looking north from 深南中路"
  summary: >-
    The six-storey block may survive as the 前楼 of the 市委大院, visible behind the gate in a 2010 photograph.
  status: lead
  notes: >-
    The photograph shows a six-storey white slab with a top window band behind the gate and the 孺子牛 sculpture,
    but trees hide the lower floors and the image cannot be dated back to the 1980s. A 2024 street-level post,
    seen only as a search summary (tier E), describes the compound as having "简简单单的几座低层办公楼". Needs a
    dated elevation, a site plan, or a demolition/renovation record.

- id: phase1.map.1982.municipal_government_compound
  source: phase1_1982_shenzhen_city_map
  locator: "Centre of the sheet, east of 上步路 and north of 深南路"
  quote: "深圳市人民政府"
  summary: >-
    The 1982 city map labels 深圳市人民政府 on the north side of 深南路, east of 上步路, with 市委宿舍 to its north
    and 上步岭 to its east, and draws a building block inside the compound.
  geography: "上步, 福田"
  date: { value: "1982", precision: year }
  status: sourced
  extracted_by: ai:opencode-municipal-government-research
  notes: >-
    Read from the 2000x1500 photograph of the paper map. The map's 1982 date is the reproducing article's, not an
    imprint; no scale, legend or imprint is visible. The sheet also labels 科学馆 south of the compound, which may
    still have been a planned facility in 1982, so it may mix built and proposed features: treat the blocks as
    schematic, not as a survey of completed work. Combined with phase1.site.municipal_government.address_2017 and
    gate_coords_2010, the labels fix the compound's relative position without a georeferenced transform.

