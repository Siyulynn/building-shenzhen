- id: phase1.event.municipal_government.2004_move
  source: phase1_2004_sz_gov_move_civic_center
  locator: "Paragraph beginning 深南中路的深圳市政府"
  quote: "深南中路的深圳市政府，这里是深圳市委、市政府领导以及人事局、纪委等部门的办公点。“大搬家”之后，这里将作为深圳市委的办公地，深圳市委、市政府合署办公的历史将结束。"
  summary: >-
    In May 2004 the municipal bureaus began moving out of the 一办 and 二办 compounds on 深南中路 into the Civic
    Center, ending joint Party–government occupancy; the 深南中路 site remained the Party committee's office.
  date: { value: "2004-05-17", precision: day }
  geography: "深南中路, Futian"
  status: sourced
  extracted_by: ai:opencode-municipal-government-research
  notes: >-
    Contemporaneous press report (中新网, citing 《广州日报》). It dates the start of the move; the Civic Center
    opened on 31 May 2004. The same article calls the old offices "20多年办公历史", consistent with a 1981-82
