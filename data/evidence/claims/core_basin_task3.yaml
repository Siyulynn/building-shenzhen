  quote: "1981年1月15日，中英合建的新罗湖行人桥新桥正式启用。"
  summary: "A photo caption dates the opening of the jointly built new Lo Wu pedestrian bridge to 15 January 1981."
  date: {"value":"1981-01-15","precision":"day"}
  status: sourced
  extracted_by: "ai:opencode-luohu-crossing-check"
  notes: >-
    The caption supplies the day; the running text of the same article only says 1981, and the 2024
    port-staff interview also stops at the year. Two independent accounts agree on 1981, one on the day.
