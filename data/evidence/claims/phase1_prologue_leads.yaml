- id: phase1.event.construction_corps_december_arrival
  source: phase1_hkcd_shan_jinsheng
  locator: "先遣隊連長單金生, passage beginning 我們拉上全部的生活、勞動物資"
  quote: "12月4日上火車，12月8日到達深圳"
  summary: Shan Jinsheng recalled his advance group arriving at Sungang station on 8 December 1979 and basing itself near present-day Tongxinling.
  date: { value: "1979-12-08", precision: day }
  status: sourced
  extracted_by: ai:phase1-construction-corps-research
  notes: In the same interview Shan dates the call to return to his unit to 20 November, the briefing to 22 November, and describes building bamboo shelters after arrival.
