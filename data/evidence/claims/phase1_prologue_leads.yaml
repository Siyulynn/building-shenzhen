- id: phase1.event.construction_corps_first_units
  source: phase1_sz_oral_history_ma_chengli
  locator: "Printed pp. 48–49, first Anshan train and unloading at Caiwuwei"
  quote: "1979年11月，第一列军列从大雪纷飞的鞍山装好设备后"
  summary: Ma Chengli recalled the first train from his Anshan contingent leaving for Shenzhen in November 1979 and unloading at Caiwuwei.
  date: { value: "1979-11", precision: month }
  status: sourced
  extracted_by: ai:phase1-construction-corps-research
  notes: >-
    The date in this quote is for the departure. A 2017 People's Daily Overseas Edition version of Ma's account places
    his group's arrival in Shenzhen in November too. The scope is Ma's Anshan contingent. See the separate September
    archive claim and December arrival account before assigning a date to the whole advance formation.
