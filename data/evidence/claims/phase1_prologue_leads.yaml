- id: phase1.event.construction_corps_september_account
  source: phase1_archive_construction
  locator: "Main story, first paragraph, also reproduced on Shenzhen Government Online"
  quote: "五个建制连共1041人组成先遣团"
  summary: The archival retrospective describes an Anshan advance formation of five companies and 1,041 people in its September 1979 account.
  date: { value: "1979-09", precision: month }
  status: sourced
  extracted_by: ai:phase1-construction-corps-research
