# Claims behind the 1979 site register (content/slice/sites_1979.yaml, phase1-slice.md §3.1).
# Two claims per placed site:
#   site.<id>.exists_1979  lead from general knowledge: the site existed at the start of 1979. Needs a period source.
#   site.<id>.location     lead: a present-day OSM point used as a proxy. Needs placing on 1979 imagery (Landsat 1979-10-19,
#                          USGS 1977 aerial, KH-9), then a person checks it.
- id: site.shenzhen_market_town.exists_1979
  origin: general_knowledge
  summary: The Shenzhen market town (深圳墟), around today's Dongmen streets, was the main built-up place in the slice in 1979.
  status: lead
- id: site.shenzhen_market_town.location
  source: osm_shenzhen_places
  locator: "name=东门老街"
  summary: Proxy point at the present-day Dongmen old street.
  status: lead
  notes: Present-day position; the 1979 extent is unknown.

- id: site.county_offices.exists_1979
  origin: general_knowledge
  summary: The county's offices and state units stood in or beside the market town in 1979.
  status: lead
  notes: Which units, where and how many staff are all open. Not placed.

- id: site.luohu_crossing.exists_1979
  origin: general_knowledge
  summary: The Luohu bridge over the Shenzhen River was a passenger border crossing to Hong Kong in 1979.
  status: lead
- id: site.luohu_crossing.location
  source: osm_shenzhen_places
  locator: "name=罗湖桥"
  summary: Proxy point at the present-day Luohu bridge.
  status: lead

- id: site.shenzhen_station.exists_1979
  origin: general_knowledge
  summary: The Kowloon–Canton railway ran to a Shenzhen station by the Luohu crossing in 1979.
  status: lead
- id: site.shenzhen_station.location
  source: osm_shenzhen_places
  locator: "name=深圳站"
  summary: Proxy point at the present-day Shenzhen station, which was rebuilt later.
  status: lead

- id: site.wenjindu_crossing.exists_1979
  origin: general_knowledge
  summary: Wenjindu was a crossing used for freight to Hong Kong in 1979.
  status: lead
  notes: phase1.map.luohu_gate_roles gives the freight role in the 1985 yearbook, not yet for 1979.
- id: site.wenjindu_crossing.location
  source: osm_shenzhen_places
  locator: "name=文锦渡口岸"
  summary: Proxy point at the present-day Wenjindu port.
  status: lead

